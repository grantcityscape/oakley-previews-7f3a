<script>
'use strict';
const KEY='christmasLightingChecklist.v2', BOOK='northPoleDispatch.customers', STOCK='northPoleDispatch.stock', JOBS='northPoleDispatch.jobs';
const CITY='https://maps.ottawa.ca/arcgis/rest/services/Forestry/MapServer/0';
const COLOURS=['Warm White','Pure White','Red','Green','Blue','Yellow','Orange','Multi','Purple','Teal','Fuchsia','Lime'];
const HARD=['Only Clip (25)','Gutter Guard Clips (25)','Magnetic Roof Cap Clips (25)','Ridge Clips (25)','Spring Clips (25)','Adhesive Clips (100)','Extra Hold Adhesive Clips (100)','Magnetic Clips (100)','Screw Clips with screws (100)','TuffClips (100)','Cradle Clips (500)','Cable Hooks (100)','Concrete Anchor Eye Bolts (50)','Insulated Staples (300)','Christmas Light Wire Stapler','Lawn Staples (100)','Lawn Stakes','Clutchers for 1/8 in Wire Rope (10)','Chromaglow Pro Marrettes (50)','VHB Tape Roll','Hook Utility Strap','Loop Utility Strap','Ultimate Christmas Light Hanging Hook','Easy Peasy Hooks (10)','Brick Hanger','Wreath Hook','E17/C9 Replacement Sockets (10)','E12/C7 Replacement Sockets (10)'];
const ELEC=['String Light Adapter','Coaxial Plug Extension Cord — 15 ft','Micro Lights Plug Adapter','3-Tap Splitter','5-Tap Splitter','Curtain Lighting Power Chain','Power Cord — 15 ft','Power Cord — 100 ft','Power Cord — 1000 ft','Power Cord 3-Outlet Plug — 15 ft','3 Outlet Power Tap','Heavy Duty 3 Outlet Power Tap','Male Plugs (100)','Female Plugs (100)','Grease Filled Male Plugs (100)','Grease Filled Female Plugs (100)','Pair of Male and Female Plugs','Wire Termination Caps (100)','Outdoor Digital Timer'];
const OTHER=['Twinkle Mini Lights — coaxial 25 ft','Slow-Twinkle Mini Lights — coaxial 50 ft','Steady Stretch String Mini Lights — 25 ft','Standard Plug Mini Lights — 25 ft','Micro Lights — 23 ft / 70 lights','C6 String Lights — 25 ft / 50 lights','C7 Bulbs (25)','C9 Bulbs (25)','C9 U-Filament Bulbs (25)','G30 Bulbs (25)','G20 Bulbs (25)','G50 U-Filament Bulbs (25)','S14 Bulbs','E17 Spool — 500 ft','E12 Spool — 500 ft','E17 Magnetic Spool — 250 ft','E17 Socket Power Cord — 25 ft','E17 Socket Power Cord — 100 ft','E12 Socket Power Cord — 25 ft','E12 Socket Power Cord — 100 ft','E26 Festival Stringer — 50 ft','E26 Festival Stringer — 330 ft','E26 Pendant Power Cord — 10 ft','Icicle Lights — 7 ft / 70 LED','Twinkle Curtain Lights — 7 ft / 20 LED','Snowfall Lights — 12 in (5)','Snowfall Lights — 24 in (5)','Snowfall Lights — 36 in (5)','RGBWW strings — verify variant','RGBWW Light Controller — 500 W','Twinkly Pro — verify variant','Deluxe Wreath — unlit 30 in','Deluxe Wreath — lit 30 in','Deluxe Wreath — lit 48 in','Deluxe Wreath — lit 60 in','Royal Wreath — lit 48 in','Royal Wreath — lit 60 in','Deluxe Garland — unlit','Royal Garland — lit 9 ft','Signature Garland — 3 ft','Signature Garland — 300 ft carton','Signature Wreath Kit — unlit','Signature Wreath Kit — Warm White','Signature Wreath Frame — 48 in','Signature Wreath Frame — 60 in'];
const MINI='5 mm coaxial minis — 25 ft / 50 bulbs';
const PRODUCTS=[...COLOURS.map(c=>MINI+' · '+c),...HARD,...ELEC,...OTHER];
const uid=()=>globalThis.crypto?.randomUUID?.()||('n'+Date.now()+Math.random().toString(36).slice(2));
const n=x=>Math.max(0,Number(x)||0), money=x=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n(x));
const clone=x=>JSON.parse(JSON.stringify(x));
function blank(){return {version:'2.dispatch',id:uid(),title:'Untitled Christmas site',date:'',customer:{type:'Residential',name:'',company:'',contact:'',phone:'',email:'',siteAddress:'',billingAddress:'',sameBilling:true,notes:''},trees:[],rooflines:[],elements:[],accessories:[],labour:{installation:{include:false,crew:'',hours:'',rate:''},removal:{include:false,crew:'',hours:'',rate:''}},pricing:{setRate:'',adapterRate:'',tax:''},checklist:{power:false,permission:false,access:false},notes:''};}
function item(kind='tree'){return {id:uid(),kind,name:kind==='tree'?'New tree':kind==='roofline'?'Roofline':'New element',type:'leafy',height:'',quantity:1,density:'Classic',wrap:{trunk:true,limbs:false,canopy:true,cone:true},colour:'Warm White',hours:'',minutes:'',length:'',product:kind==='element'?'Royal Garland — lit 9 ft':MINI,spacingIn:12,litFtPerUnit:25,unitPrice:'',runs:1,photos:[],accessories:[],notes:''};}
// This calibrated overlap model satisfies the supplied anchors; it is not a recovered original engine.
function sets(t){if(!n(t.height))return 0;const w=t.wrap||{},f={Light:28/42,Classic:1,Full:61/42}[t.density]||1,h=n(t.height);let base=0;
if(t.type==='evergreen'){base=Math.max(w.trunk?7:0,w.cone?13:0)*Math.pow(h/18,1.65);}
else{base=((w.trunk?13:0)+(w.canopy?37:0)+(w.limbs?14:0)-(w.trunk&&w.canopy?8:0)-(w.limbs&&w.canopy?8:0))*Math.pow(h/25,1.7);}
return Math.ceil(Math.max(0,base)*f-1e-9);}
function units(t){if(t.kind==='tree')return sets(t)*n(t.quantity);if(t.kind==='roofline')return Math.ceil(n(t.length)/(t.product===MINI?25:n(t.litFtPerUnit)||25))*n(t.quantity);return n(t.quantity);}
function coax(t){return t.kind==='tree'||t.product===MINI||/coaxial|C6 String/.test(t.product||'');}
function materialLines(j){let lines=[];const push=(p,q,rate='',where='',supplier='Big Star')=>{if(n(q))lines.push({product:p,quantity:n(q),unitPrice:n(rate),total:n(q)*n(rate),where,supplier});};
for(const t of [...j.trees,...j.rooflines,...j.elements]){const q=units(t),p=t.kind==='tree'||t.product===MINI?MINI+' · '+(t.colour||'Warm White'):t.product;push(p,q,t.unitPrice===''&&p.startsWith(MINI)?j.pricing.setRate:t.unitPrice,t.name);
if(coax(t)&&q)push('String Light Adapter',Math.max(1,n(t.runs))*n(t.quantity),j.pricing.adapterRate,t.name+' · mandatory feed');
for(const a of t.accessories||[])push(a.product,a.quantity,a.unitPrice,t.name,a.supplier||'Big Star');
for(const ph of t.photos||[])for(const p of ph.pins||[])push(p.what,p.quantity,p.unitPrice,t.name+' · photo pin '+p.number,p.supplier||'Big Star');}
for(const a of j.accessories||[])push(a.product,a.quantity,a.unitPrice,'Whole job',a.supplier||'Big Star');return lines;}
function labourLines(j){return ['installation','removal'].filter(k=>j.labour[k]?.include).map(k=>({product:k==='installation'?'Installation crew':'Seasonal removal crew',quantity:n(j.labour[k].crew)*n(j.labour[k].hours),unitPrice:n(j.labour[k].rate),total:n(j.labour[k].crew)*n(j.labour[k].hours)*n(j.labour[k].rate),where:'Crew-hours',supplier:'Labour'}));}
function totals(j){const materials=materialLines(j),labour=labourLines(j),subtotal=[...materials,...labour].reduce((s,l)=>s+l.total,0);return {materials,labour,subtotal,tax:subtotal*n(j.pricing.tax)/100,total:subtotal*(1+n(j.pricing.tax)/100),sets:[...j.trees,...j.rooflines].reduce((s,t)=>s+units(t),0)};}
function normaliseItem(t,kind,group=''){
const v={...item(kind),...clone(t),kind};
v.quantity=t.quantity??t.qty??1;v.height=t.height??t.heightFt??'';v.length=t.length??t.lengthFt??'';v.name=t.name??t.label??v.name;
v.type=String(t.type??t.treeType??'leafy').toLowerCase();if(/conifer|evergreen/.test(v.type))v.type='evergreen';else v.type='leafy';
const d=String(t.density??'Classic').toLowerCase();v.density=({light:'Light',classic:'Classic',full:'Full'})[d]||'Classic';
const w=t.wrapParts??t.wrap;
if(w&&typeof w==='object')v.wrap={trunk:false,limbs:false,canopy:false,cone:false,...w};
else if(typeof w==='string'){const mode=w.toLowerCase().replace(/[_ -]+/g,'');v.wrap={trunk:false,limbs:false,canopy:false,cone:false};if(['both','trunk+canopy','trunkcanopy','trunk+cone','trunkcone'].includes(mode)){v.wrap.trunk=true;v.wrap[v.type==='evergreen'?'cone':'canopy']=true;}else if(['full','all','fulltreatment'].includes(mode)){v.wrap.trunk=true;if(v.type==='evergreen')v.wrap.cone=true;else{v.wrap.limbs=true;v.wrap.canopy=true;}}else for(const part of ['trunk','limbs','canopy','cone'])if(mode.includes(part))v.wrap[part]=true;}
else v.wrap={...item(kind).wrap};
delete v.wrapParts;
if(kind==='roofline'){const light=t.product??t.lightType??MINI;v.product=/^(mini|minis|mini lights|5mm|5 mm)$/i.test(light)?MINI:light;}
if(group)v._elementGroup=group;
v.photos=Array.isArray(t.photos)?clone(t.photos):[];v.accessories=Array.isArray(t.accessories)?clone(t.accessories):[];return v;
}
function migrate(raw){const j=Object.assign(blank(),clone(raw));j.customer=Object.assign(blank().customer,typeof raw.client==='object'?raw.client:{},raw.customer||{});if(typeof raw.client==='string'&&!j.customer.name&&!j.customer.company)j.customer.name=raw.client;j.customer.siteAddress=j.customer.siteAddress||raw.siteAddress||raw.address||'';j.title=raw.title||raw.jobName||j.title;j.pricing=Object.assign(blank().pricing,raw.pricing||{});j.labour={...blank().labour,...(raw.labour||{})};for(const k of ['installation','removal'])j.labour[k]={...blank().labour[k],...(raw.labour?.[k]||{})};j.checklist={...blank().checklist,...(raw.checklist||{})};
for(const [key,kind] of [['trees','tree'],['rooflines','roofline'],['elements','element']])j[key]=(Array.isArray(raw[key])?raw[key]:[]).map(t=>normaliseItem(t,kind));
for(const group of ['garlands','wreaths'])for(const t of Array.isArray(raw[group])?raw[group]:[]){const existing=t.id&&j.elements.find(v=>v.id===t.id);if(existing)existing._elementGroup=group;else j.elements.push(normaliseItem(t,'element',group));}
j.accessories=Array.isArray(raw.accessories)?clone(raw.accessories):[];j._originalImport=raw._originalImport||clone(raw);return j;}
function legacyWrap(t){const w=t.wrap||{},parts=(t.type==='evergreen'?['trunk','cone']:['trunk','limbs','canopy']).filter(k=>w[k]);if(!parts.length)return 'none';if(parts.length===1)return parts[0];if(parts.includes('trunk')&&parts.includes(t.type==='evergreen'?'cone':'canopy')&&!parts.includes('limbs'))return 'both';if(t.type!=='evergreen'&&parts.length===3)return 'full';return parts.join('+');}
function unionItem(t){const v=clone(t);v.qty=t.quantity;v.label=t.name;if(t.kind==='tree'){v.heightFt=t.height;v.wrapParts=clone(t.wrap);v.wrap=legacyWrap(t);v.density=String(t.density).toLowerCase();}if(t.kind==='roofline'){v.lengthFt=t.length;v.lightType=t.product===MINI?'minis':t.product;}return v;}
function unionJob(j){const v=clone(j),client=j.customer.company||j.customer.name||'';v.client=typeof j.client==='object'&&j.client!==null?{...clone(j.client),...clone(j.customer)}:client;v.address=j.customer.siteAddress;v.siteAddress=j.customer.siteAddress;
// Preserve checklist-side payloads without guessing at their undocumented nested schema.
v.power=j.power??clone(j.checklist);v.takedown=j.takedown??clone(j.labour.removal);
v.trees=j.trees.map(unionItem);v.rooflines=j.rooflines.map(unionItem);v.elements=j.elements.map(unionItem);
const group=t=>t._elementGroup||(/wreath/i.test(t.product+' '+t.name)?'wreaths':/garland/i.test(t.product+' '+t.name)?'garlands':'other');v.garlands=v.elements.filter(t=>group(t)==='garlands');v.wreaths=v.elements.filter(t=>group(t)==='wreaths');return v;}

function addCustomer(book,c){const name=c.type==='Commercial'?c.company:c.name;if(!name?.trim()||!c.siteAddress?.trim()||!(c.phone?.trim()||c.email?.trim()))throw Error('Complete name/company, site address and phone or email.');const key=JSON.stringify([name.trim().toLowerCase(),c.siteAddress.trim().toLowerCase()]);const found=book.find(x=>x.bookKey===key);if(found)return found;const entry={...clone(c),id:uid(),bookKey:key};book.push(entry);return entry;}
function aggregate(lines){const m={};for(const l of lines){const key=l.supplier+'|'+l.product;if(!m[key])m[key]={...l,quantity:0,total:0};m[key].quantity+=l.quantity;m[key].total+=l.total;}return Object.values(m);}
// ENGINE END
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f;}catch{return f;}}
let rawText=localStorage.getItem(KEY), raw=null, loadWarning='';try{raw=rawText?JSON.parse(rawText):null;}catch{loadWarning='Existing storage is not valid JSON. It has NOT been overwritten. Export the raw backup.';}
let envelope=null, source=raw;if(raw&&Array.isArray(raw.jobs)){envelope=raw;source=raw.jobs[raw.activeJobIndex||0]||null;loadWarning='Jobs-envelope detected. The complete original is retained; export before saving. Verify imported fields.';}else if(Array.isArray(raw)){envelope=raw;source=raw[0];loadWarning='Array storage detected; complete original retained. Verify imported fields.';}
let job=source&&typeof source==='object'?migrate(source):blank(),book=read(BOOK,[]),stock=read(STOCK,{}),scheduled=read(JOBS,[]),tab='work',selected=null,dirty=false,lookup=[],lookupInfo='',inventoryFilter='';
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',6000);}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){toast('Storage failed: '+e.message+'. Export JSON now.');return false;}}
function touch(){dirty=true;$('#status').textContent='Unsaved changes · '+job.title+' · Explicit Save job or Export full JSON to keep this work.';}
const all=()=>[...job.trees,...job.rooflines,...job.elements];const current=()=>all().find(t=>t.id===selected);
const opt=(values,v)=>values.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function field(label,path,value,type='text',extra=''){return `<label>${label}<input type="${type}" data-path="${path}" value="${esc(value)}" ${extra}></label>`;}
function select(label,path,value,values){return `<label>${label}<select data-path="${path}">${opt(values,value)}</select></label>`;}
function check(label,path,value){return `<label class="tick"><input type="checkbox" data-path="${path}" ${value?'checked':''}>${label}</label>`;}
function text(label,path,value){return `<label>${label}<textarea data-path="${path}">${esc(value)}</textarea></label>`;}
function resolve(path){let a=path.split('.'),o=path.startsWith('item.')?current():job;if(a[0]==='item')a.shift();while(a.length>1){const k=a.shift();if(!o[k]||typeof o[k]!=='object')o[k]={};o=o[k];}return [o,a[0]];}
function render(){const pages=[['work','01 · Site manifest'],['customer','02 · Customer desk'],['city','03 · Ottawa tree desk'],['crew','04 · Crew dispatch'],['stock','05 · Supply portal'],['quote','06 · Quote & takeoff'],['files','07 · Save / export']];$('#nav').innerHTML=pages.map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}</button>`).join('')+'<button data-act="calm">Calm Mode</button><small>Local-first workbench<br>CAD · prices ship blank<br>No embedded customer data<br>No city trees preloaded</small>';$('#app').innerHTML=`<section class="sheet">${({work:workView,customer:customerView,city:cityView,crew:crewView,stock:stockView,quote:quoteView,files:filesView})[tab]()}</section>`;bind();}
function labourBadge(){const a=job.labour.installation.include,b=job.labour.removal.include;return a&&b?'Both':a?'Installation':b?'Take-down':'Neither';}
function workView(){const t=current(),r=totals(job);return `<div class="eyebrow">01 / Site manifest</div><h2>${esc(job.title)}</h2><div class="bar noprint"><button data-add="tree">+ Tree</button><button data-add="roofline">+ Roofline</button><button data-add="element">+ Garland / wreath / other</button><button data-tab="city">Start from city trees</button><button data-tab="crew">Crews: ${labourBadge()}</button></div><div class="metrics"><div><div class="metric" id="setMetric">${r.sets}</div><small>Tree + roofline units</small></div><div><div class="metric" id="priceMetric">${money(r.total)}</div><small>Current job incl. entered tax</small></div></div><div class="work"><aside class="manifest">${all().map(x=>`<button data-select="${x.id}" class="${selected===x.id?'active':''}"><span class="tag">${esc(x.kind)}</span><br>${esc(x.name)}<br><small>${units(x)} units · ${n(x.hours)}h ${n(x.minutes)}m</small></button>`).join('')||'<p>Your manifest is empty. Add an item or use the Ottawa tree desk.</p>'}</aside><article>${t?itemView(t):`<h3>Build the site, not a second estimate.</h3><p>Choose an item at left. Its survey, wrap geometry, photo pins, materials and price live in the same record.</p><div class="notice">Ottawa records provide species, diameter and location—not measured height. City lookup never substitutes diameter for height.</div><div class="grid">${check('Power source checked','checklist.power',job.checklist.power)}${check('Owner / municipal authorization checked','checklist.permission',job.checklist.permission)}${check('Safe access checked','checklist.access',job.checklist.access)}</div>`}</article></div>`;}
function itemView(t){return `<div class="bar"><h2 style="flex:1">${esc(t.name)}</h2><button data-act="duplicate">Duplicate</button><button data-act="delete">Remove</button></div><div class="grid">${field('Item name','item.name',t.name)}${field('Quantity (identical units)','item.quantity',t.quantity,'number','min="1" step="1"')}${t.kind==='tree'?`${select('Tree form (confirm in field)','item.type',t.type,['leafy','evergreen'])}${field('Measured height · ft','item.height',t.height,'number','min="0" step="0.1"')}${select('Density','item.density',t.density,['Light','Classic','Full'])}${select('Colour','item.colour',t.colour,COLOURS)}<div class="wide bar">${(t.type==='evergreen'?['trunk','cone']:['trunk','limbs','canopy']).map(k=>check(k[0].toUpperCase()+k.slice(1),'item.wrap.'+k,t.wrap[k])).join('')}</div>${!n(t.height)?'<div class="notice wide">Height required. No estimate is generated from species or DBH.</div>':''}`:`${select('Product / assembly','item.product',t.product,[MINI,...OTHER])}${t.kind==='roofline'?field('Lit length · ft','item.length',t.length,'number','min="0" step="0.1"')+field('Editable coverage · ft per unit (non-minis)','item.litFtPerUnit',t.litFtPerUnit,'number','min="0.01" step="0.1"'):''}${select('Colour (verify selected product availability)','item.colour',t.colour,COLOURS)}`}${field('Item installation hours (planning only)','item.hours',t.hours,'number','min="0"')}${field('Item installation minutes','item.minutes',t.minutes,'number','min="0" max="59"')}${field('Selling price / material unit · CAD','item.unitPrice',t.unitPrice,'number','min="0" step="0.01"')}${coax(t)?field('Independent coaxial feeds / physical item','item.runs',t.runs,'number','min="1" step="1"'):''}</div><p class="muted" id="itemEstimate">${estimateLabel(t)}</p><div class="notice">Crew pricing: ${labourBadge()}. Item time is planning only, not extra billed labour. <button data-tab="crew">Open crew work orders</button></div>${t.city?`<details open><summary>City provenance · ${esc(t.city.attributes?.TREEID||t.city.attributes?.OBJECTID)}</summary><pre>${esc(JSON.stringify(t.city,null,2))}</pre><p class="muted">DBH is trunk diameter in centimetres, not height. Confirm identity, condition, access and permission on site.</p></details>`:''}${text('Item / access notes','item.notes',t.notes)}<details open><summary>Hardware & electrical · this item</summary>${accessoryView(t.accessories,'item')}<p class="muted">${coax(t)?'Required String Light Adapters are generated automatically from feeds × item quantity while lights are on. Added adapter lines are extras.':'No coaxial adapter automatically inferred for this product. Confirm its power system.'}</p></details>${photoView(t)}`;}
function estimateLabel(t){return `${units(t)} material units for this record${t.kind==='tree'?' · '+sets(t)+' sets / tree':''}. ${coax(t)&&units(t)?Math.max(1,n(t.runs))*n(t.quantity)+' mandatory String Light Adapter(s).':''} Minis: 25 ft / 50 lights / 6-inch spacing. Non-mini roofline coverage is an editable assumption, not an inferred supplier specification.`;}
function accessoryView(arr,scope){return `<div class="muted">Pack products are counted and priced per named pack; loose products per named unit. Enter whole required packs. Generic additions may use a custom product name.</div>${arr.map((a,i)=>`<div class="row"><label>Product / supplier<select data-access="${scope}|${i}|product">${opt([...new Set([a.product,...HARD,...ELEC,...OTHER])],a.product)}</select><select aria-label="Supplier" data-access="${scope}|${i}|supplier">${opt(['Big Star','Classic Displays','Cooper rentals','Other'],a.supplier||'Big Star')}</select></label><label>Qty<input type="number" min="0" value="${esc(a.quantity)}" data-access="${scope}|${i}|quantity"></label><label>CAD/unit<input type="number" min="0" step=".01" value="${esc(a.unitPrice)}" data-access="${scope}|${i}|unitPrice"></label><button data-delaccess="${scope}|${i}" aria-label="Remove accessory">×</button></div>`).join('')}<div class="bar"><button data-addaccess="${scope}">+ Supplier item</button><button data-custom="${scope}">+ Custom material / booking</button></div>`;}
function photoView(t){return `<details open><summary>Item photos & customer-facing pins</summary><label class="noprint">Add item photos<input id="photos" type="file" accept="image/*" multiple></label><p class="muted">Tap a photo to add a priced quote pin. Coordinates are normalized to the displayed image. Pin quantities are explicit job quantities (not multiplied by the item quantity). Photos are compressed locally; full JSON contains images and pins. Print quote includes the marked-up photos.</p>${t.photos.map((p,i)=>typeof p==='string'?`<div class="notice">Legacy photo reference retained: ${esc(p)}</div>`:`<div><div class="photo" data-photo="${i}"><img alt="${esc(p.name||t.name)}" src="${/^(data:image\/|blob:)/.test(p.data||'')?esc(p.data):''}">${(p.pins||[]).map((x,k)=>`<button class="pin" style="left:${n(x.x)*100}%;top:${n(x.y)*100}%" data-pin="${i}|${k}" title="${esc(x.what)}">${k+1}</button>`).join('')}</div><div class="muted">${esc(p.name)} · ${(p.pins||[]).map((x,k)=>`${k+1}: ${esc(x.what)} × ${n(x.quantity)} @ ${money(x.unitPrice)}`).join(' / ')}</div><button class="noprint" data-delphoto="${i}">Remove photo</button></div>`).join('')}</details>`;}
function customerView(){const c=job.customer;return `<div class="eyebrow">02 / Customer desk</div><h2>A complete customer, once.</h2><div class="bar"><button data-act="newcustomer">New customer</button><select id="existing" aria-label="Existing customer"><option value="">Existing · choose from book (${book.length})</option>${book.map((b,i)=>`<option value="${i}">${esc(b.company||b.name)} · ${esc(b.siteAddress)}</option>`).join('')}</select></div><p class="muted">Typing edits this job only. Nothing enters the customer book until “Complete customer” passes validation.</p><div class="grid">${select('Account type','customer.type',c.type,['Residential','Commercial'])}${field('Residential name','customer.name',c.name)}${field('Commercial company','customer.company',c.company)}${field('Commercial contact','customer.contact',c.contact)}${field('Phone','customer.phone',c.phone,'tel')}${field('Email','customer.email',c.email,'email')}${field('Site address','customer.siteAddress',c.siteAddress)}${check('Billing same as site','customer.sameBilling',c.sameBilling)}${field('Billing address (if different)','customer.billingAddress',c.billingAddress)}${text('Customer notes','customer.notes',c.notes)}</div><div class="bar"><button data-act="completecustomer">Complete customer → write one book entry</button><button data-map="google">Google Maps</button><button data-map="earth">Google Earth</button><button data-map="geo">GeoOttawa + address</button></div><div id="addressPanel"></div><p class="muted">Customer book and jobs stay in this browser. Export contains private customer information; share intentionally.</p>`;}
function cityView(){return `<div class="eyebrow">03 / Ottawa tree desk</div><h2>Real records. Measured heights.</h2><p>Search the City of Ottawa Forestry / Tree Inventory point layer by street, TREEID or nearby coordinates. Results are candidates—not a site boundary or authorization to decorate.</p><div class="grid"><label>Search mode<select id="lookupMode">${opt(['Street contains','TREEID exact','Nearby lat, lon'],'Street contains')}</select></label><label>Search value<input id="lookupValue" placeholder="BANK or tree ID or 45.42,-75.69"></label><label>Nearby radius · metres<input id="radius" type="number" min="1" max="1000" value="100"></label><div class="bar"><button data-act="lookup">Query City (online)</button><button data-map="geo">Open GeoOttawa</button></div></div><p id="lookupInfo" class="notice">${esc(lookupInfo||'No city records ship in this file. Online query is implemented but not live-browser verified here. On failure, use a downloaded City GeoJSON / Esri JSON extract below; do not invent records.')}</p><label>Import local City GeoJSON / Esri feature JSON<input id="cityImport" type="file" accept=".json,.geojson,application/json"></label><div class="scroll"><table><thead><tr><th>Record</th><th>Species / DBH</th><th>Place / status</th><th>Choose</th></tr></thead><tbody>${lookup.map((f,i)=>{let a=f.attributes||f.properties||{};return `<tr><td>${esc(a.TREEID||a.OBJECTID)}<br><small>${esc(a.GLOBALID)}</small></td><td>${esc(a.SPECIES)}<br>${esc(a.DBH??'Unknown')} cm diameter</td><td>${esc(a.ADDNUM)} ${esc(a.ADDSTR)}<br>${esc(a.STATUS)} · ${esc(a.FLAG||'No removal flag returned')}</td><td><button data-cityadd="${i}">Add candidate</button></td></tr>`;}).join('')}</tbody></table></div><details><summary>Tree-data memo / limits</summary><p>Verified layer fields: TREEID, GLOBALID, OBJECTID, SPECIES, DBH (diameter cm), ADDNUM, ADDSTR, LTLOCATION, RDLOCATION, OWNERSHIP, STATUS, FLAG, MODIFYDATE and point geometry. Request geometry in EPSG:4326; source service is Web Mercator (3857). X_COORD/Y_COORD are not assumed to be longitude/latitude. OBJECTID is the layer row key, not a durable physical tag. TREEID is indexed but not declared unique; retain GLOBALID and source endpoint too.</p><p>No height or crown dimension field was present in the inspected layer. Imported trees have blank height and zero estimate until measured; leafy is only the initial editable form. Original attributes, geometry, source, retrieval time and local-file origin are retained. Municipal inventory is not every privately owned tree; absence is not evidence of no tree. STATUS / FLAG may indicate stale, removed, inactive or proposed records.</p><p>Online results page through 200 records at a time, capped at 1,000 with a truncation warning. Connection / CORS / file-origin failures are surfaced. A street search does not geocode or infer ownership from the job address. Nothing claims a live search succeeded before an actual response.</p><a href="${CITY}?f=pjson" target="_blank" rel="noopener">Verified layer metadata</a></details>`;}
function crewView(){return `<div class="eyebrow">04 / Crew dispatch</div><h2>Two work orders. Explicit inclusion.</h2><p>Included: ${labourBadge()}. Rates ship blank. Item hours and minutes are planning estimates only; crew blocks alone price labour.</p><div class="grid">${['installation','removal'].map(k=>{let l=job.labour[k];return `<div><h3>${k==='installation'?'INSTALLATION CREW':'SEASONAL REMOVAL CREW'}</h3>${check('INCLUDE this crew in quote + takeoff','labour.'+k+'.include',l.include)}${field('Crew size · people','labour.'+k+'.crew',l.crew,'number','min="0"')}${field('Elapsed crew hours','labour.'+k+'.hours',l.hours,'number','min="0" step=".25"')}${field('CAD / person-hour · blank = no dollars','labour.'+k+'.rate',l.rate,'number','min="0" step=".01"')}<p id="labour-${k}">${l.include?money(n(l.crew)*n(l.hours)*n(l.rate)):'Excluded entirely'}</p><button data-copyhours="${k}">Use planned item person-hours ÷ crew</button></div>`;}).join('')}</div><h3>With the work</h3><div class="scroll"><table><tr><th>Item</th><th>Quantity</th><th>Planned per-item time</th><th>Total person-hours</th></tr>${all().map(t=>`<tr><td>${esc(t.name)}</td><td>${n(t.quantity)}</td><td>${n(t.hours)} h ${n(t.minutes)} m</td><td>${((n(t.hours)+n(t.minutes)/60)*n(t.quantity)).toFixed(2)}</td></tr>`).join('')}</table></div>`;}
function demandRows(){const now=aggregate(materialLines(job)),future={};for(const j of scheduled.filter(j=>j.id!==job.id&&j.date))for(const l of aggregate(materialLines(migrate(j)))){const k=l.supplier+'|'+l.product;future[k]=(future[k]||0)+l.quantity;}const keys=new Set([...PRODUCTS.map(p=>'Big Star|'+p),...now.map(l=>l.supplier+'|'+l.product),...Object.keys(future),...Object.keys(stock)]);return [...keys].map(k=>{const [supplier,...rest]=k.split('|'),product=rest.join('|'),s=stock[k]||{},current=now.find(l=>l.supplier+'|'+l.product===k)?.quantity||0,onHand=n(s.onHand),coming=future[k]||0,need=Math.max(0,current+coming-onHand),pull=Math.min(current,onHand);return {key:k,supplier,product,onHand,low:n(s.low),current,coming,pull,need,incoming:n(s.incoming),booking:supplier==='Cooper rentals'};});}
function stockView(){const rows=demandRows().filter(r=>r.product.toLowerCase().includes(inventoryFilter.toLowerCase()));return `<div class="eyebrow">05 / Supply portal</div><h2>Shelf → van → supplier.</h2><p class="muted">Current job is compared with on-hand; “coming up” is demand from other explicitly scheduled jobs, never a second copy of this job. To order includes current + scheduled demand less stock. Incoming is shown separately, not treated as received. Stock is not decremented by an estimate. Quantities use each named product's selling unit / pack. Variant-level availability and fractional pack conversion are not automated.</p><label>Filter product<input id="stockFilter" value="${esc(inventoryFilter)}" placeholder="adapter, clip, mini…"></label><div class="scroll"><table><thead><tr><th>Product / supplier</th><th>On hand</th><th>Low threshold</th><th>Incoming</th><th>Current</th><th>Pull</th><th>Coming up</th><th>To order / book</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.product)}<br><small>${esc(r.supplier)} · ${r.booking?'BOOKING, NOT STOCK':r.onHand<=r.low?'LOW':'on hand'}</small></td>${['onHand','low','incoming'].map(k=>`<td>${r.booking?'—':`<input aria-label="${esc(r.product+' '+k)}" type="number" min="0" value="${r[k]}" data-stock="${esc(r.key)}" data-stockfield="${k}">`}</td>`).join('')}<td>${r.current}</td><td>${r.booking?'—':r.pull}</td><td>${r.coming}</td><td>${r.booking?r.current+r.coming:r.need}</td></tr>`).join('')}</tbody></table></div><div class="bar"><button data-act="savestock">Save stock ledger</button><button data-act="schedule">Save this job to scheduled demand</button><button data-act="unschedule">Remove this job from schedule</button><button data-act="orderscsv">Export order CSV</button></div><h3>Automatic order list / bookings</h3>${orderView()}<details><summary>Scheduled jobs (${scheduled.length})</summary>${scheduled.map(j=>`<p>${esc(j.date)} · ${esc(j.title)} <button data-unschedule="${esc(j.id)}">Remove</button></p>`).join('')}</details>`;}
function orderView(){const rows=demandRows().filter(r=>r.booking?r.current+r.coming:r.need);return ['Big Star','Classic Displays','Other','Cooper rentals'].map(s=>{const rr=rows.filter(r=>r.supplier===s);return rr.length?`<h3>${s==='Cooper rentals'?'Cooper rentals · booking requests':s}</h3><ul>${rr.map(r=>`<li>${esc(r.product)} · ${r.booking?r.current+r.coming:r.need} ${r.booking?'to book':'to order'}</li>`).join('')}</ul>`:'';}).join('')||'<p>No shortages or bookings.</p>';}
function quoteView(){const r=totals(job);return `<div class="eyebrow">06 / Quote & takeoff</div><h2>${esc(job.title)}</h2><p>${esc(job.customer.company||job.customer.name)} · ${esc(job.customer.siteAddress)}</p><div class="grid noprint">${field('Default mini-set selling price · CAD','pricing.setRate',job.pricing.setRate,'number','min="0" step=".01"')}${field('String Light Adapter selling price · CAD','pricing.adapterRate',job.pricing.adapterRate,'number','min="0" step=".01"')}${field('Sales tax · % (blank = zero)','pricing.tax',job.pricing.tax,'number','min="0" step=".01"')}</div><div class="metrics"><div><small>Subtotal</small><div class="metric" id="subtotal">${money(r.subtotal)}</div></div><div><small>Tax</small><div class="metric" id="taxTotal">${money(r.tax)}</div></div><div><small>Total CAD</small><div class="metric" id="quoteTotal">${money(r.total)}</div></div></div><p>Labour included: ${labourBadge()}. Blank material / labour prices contribute zero; this is not a complete priced quote until rates are entered.</p><div class="scroll"><table><thead><tr><th>Work / product</th><th>Quantity</th><th>CAD/unit</th><th>Total</th></tr></thead><tbody id="quoteRows">${quoteRows(r)}</tbody></table></div><h3>Crew materials takeoff</h3><div class="scroll"><table><tr><th>Product</th><th>Quantity</th><th>Supplier</th></tr>${aggregate([...r.materials,...r.labour]).map(l=>`<tr><td>${esc(l.product)}</td><td>${l.quantity}</td><td>${esc(l.supplier)}</td></tr>`).join('')}</table></div><details><summary>Whole-job hardware, electrical & rentals</summary>${accessoryView(job.accessories,'job')}</details><h3>Photo instructions / customer view</h3>${all().filter(t=>t.photos.length).map(t=>`<h3>${esc(t.name)}</h3>${t.photos.filter(p=>typeof p==='object').map(p=>`<div class="photo"><img alt="${esc(t.name)}" src="${/^data:image\//.test(p.data||'')?esc(p.data):''}">${(p.pins||[]).map((v,k)=>`<span class="pin" style="left:${n(v.x)*100}%;top:${n(v.y)*100}%">${k+1}</span>`).join('')}</div><p>${(p.pins||[]).map((v,k)=>`${k+1}. ${esc(v.what)} × ${n(v.quantity)} @ ${money(v.unitPrice)}`).join(' / ')}</p>`).join('')}`).join('')}<div class="bar noprint"><button data-act="print">Print / PDF via browser</button><button data-act="takeoffcsv">Export takeoff CSV</button><button data-act="export">Export full job JSON</button></div>`;}
function quoteRows(r){return [...r.materials,...r.labour].map(l=>`<tr><td>${esc(l.product)}<br><small>${esc(l.where)}</small></td><td>${l.quantity}</td><td>${money(l.unitPrice)}</td><td>${money(l.total)}</td></tr>`).join('');}
function filesView(){return `<div class="eyebrow">07 / Archive desk</div><h2>Keep the whole job.</h2>${loadWarning?`<div class="notice">${esc(loadWarning)}</div>`:''}<div class="grid">${field('Job title','title',job.title)}${field('Scheduled date','date',job.date,'date')}${text('Job notes','notes',job.notes)}</div><div class="bar"><button data-act="save">Save job locally</button><button data-act="export">Export full job JSON</button><button data-act="rawexport">Export original raw storage</button><button data-act="bundle">Export workspace backup</button><button data-act="newjob">New job</button></div><label>Import full job / workspace JSON<input id="jobImport" type="file" accept=".json,application/json"></label><div class="notice">Data-contract repair: legacy qty, heightFt, label, lengthFt, lightType, wrap modes and density case are mapped on load. Saves and exports emit the checklist / estimator union keys (client, address, power, takedown, trees, rooflines, wreaths, garlands) plus customer, labour and inventory on full export. Independent toggles travel losslessly as wrapParts beside the legacy wrap mode. Unknown keys and complete original imports are preserved. Receipt-described migration is regression-tested; undocumented nested schemas and external consumers are not certified. Saving is explicit and a one-time raw backup is written before the shared key changes. No incumbent file was used.</div><p class="muted">File works offline for capture, calculations, photo pins, local imports and exports. Maps and live City queries require internet. Browser storage may be temporary or isolated for file:// documents and can fill; export often. Photos remain in JSON, not an external server. This tool does not perform load/circuit engineering, municipal approvals, purchasing, or inventory reservations.</p><details><summary>Geometry disclosure</summary><p>The supplied regression counts are implemented using a calibrated overlap model: leafy Classic at 25 ft trunk 13, canopy 37, limbs 14; trunk/canopy overlap 8 and limbs/canopy overlap 8. Evergreen at 18 ft uses maximum envelope (trunk 7, cone 13) rather than summed parts. Height scaling uses exponents 1.7 leafy / 1.65 evergreen; density factors are 28/42, 1, 61/42. Round up only at the end of each physical tree. These are disclosed interpolation assumptions, not a reconstruction or proof of the original spiral engine. Unspecified heights, limb combinations and densities require validation before production quoting.</p></details><details><summary>Supplier basis</summary><p>Embedded names and twelve mini-light colours come from the supplied 2026-11-17 Big Star catalogue sweep. No supplier prices ship. Names are a normalized operational subset, not a complete SKU/variant catalogue. Pack size is part of the displayed product name. Generic custom materials are never automatically attributed to Big Star. Coaxial minis generate mandatory String Light Adapters per independent feed; actual chain limits and circuit design must be verified in the field. No order is transmitted.</p></details>`;}
function refreshNumbers(){const r=totals(job);for(const [id,v] of [['setMetric',r.sets],['priceMetric',money(r.total)],['subtotal',money(r.subtotal)],['taxTotal',money(r.tax)],['quoteTotal',money(r.total)]])if(document.getElementById(id))document.getElementById(id).textContent=v;for(const k of ['installation','removal']){const el=document.getElementById('labour-'+k),l=job.labour[k];if(el)el.textContent=l.include?money(n(l.crew)*n(l.hours)*n(l.rate)):'Excluded entirely';}if($('#quoteRows'))$('#quoteRows').innerHTML=quoteRows(r);if($('#itemEstimate')&&current())$('#itemEstimate').textContent=estimateLabel(current());}
function bind(){document.querySelectorAll('[data-path]').forEach(el=>el.addEventListener('input',()=>{let [o,k]=resolve(el.dataset.path);o[k]=el.type==='checkbox'?el.checked:el.value;touch();if(el.type==='checkbox'||el.tagName==='SELECT')render();else refreshNumbers();}));
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const k=b.dataset.add,t=item(k);job[k==='tree'?'trees':k==='roofline'?'rooflines':'elements'].push(t);selected=t.id;touch();render();});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;render();});
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>openMap(b.dataset.map));
document.querySelectorAll('[data-access]').forEach(el=>el.oninput=()=>{const [s,i,k]=el.dataset.access.split('|');(s==='item'?current().accessories:job.accessories)[i][k]=el.value;touch();});
document.querySelectorAll('[data-addaccess]').forEach(b=>b.onclick=()=>{(b.dataset.addaccess==='item'?current().accessories:job.accessories).push({product:'Outdoor Digital Timer',quantity:1,unitPrice:'',supplier:'Big Star'});touch();render();});
document.querySelectorAll('[data-custom]').forEach(b=>b.onclick=()=>{let p=prompt('Custom product / booking description');if(!p?.trim())return;(b.dataset.custom==='item'?current().accessories:job.accessories).push({product:p.trim(),quantity:1,unitPrice:'',supplier:'Other'});touch();render();});
document.querySelectorAll('[data-delaccess]').forEach(b=>b.onclick=()=>{const[s,i]=b.dataset.delaccess.split('|');(s==='item'?current().accessories:job.accessories).splice(+i,1);touch();render();});
if($('#existing'))$('#existing').onchange=e=>{if(e.target.value==='')return;job.customer=clone(book[+e.target.value]);touch();render();};if($('#photos'))$('#photos').onchange=async e=>{const t=current();for(const f of e.target.files){try{const data=await compress(f);t.photos.push({id:uid(),name:f.name,data,pins:[]});touch();}catch(err){toast(err.message);}}render();};

function exportObject(){const r=totals(job);return {...unionJob(job),exportedAt:new Date().toISOString(),exportFormat:'christmasLightingChecklist.v2.union',takeoff:aggregate([...r.materials,...r.labour]),quoteLines:[...r.materials,...r.labour],totals:{subtotal:r.subtotal,tax:r.tax,total:r.total},inventory:{rows:demandRows(),orderLines:demandRows().filter(r=>r.need||r.booking)},compatibility:{certifiedV12:false,fieldMapRevision:2,unionKeys:true,originalPreserved:!!job._originalImport}};}

function save(){try{if(rawText&&!localStorage.getItem(KEY+'.preDispatchBackup'))localStorage.setItem(KEY+'.preDispatchBackup',rawText);let out=unionJob(job);if(envelope){out=clone(envelope);if(Array.isArray(out))out[0]=unionJob(job);else out.jobs[out.activeJobIndex||0]=unionJob(job);}if(!store(KEY,out))return;store(BOOK,book);store(STOCK,stock);store(JOBS,scheduled);dirty=false;$('#status').textContent='Saved locally · '+new Date().toLocaleString()+' · '+job.title;toast('Saved. Export for a portable backup.');}catch(e){toast('Save failed: '+e.message);}}
async function action(a){try{switch(a){case 'calm':document.body.classList.toggle('calm');break;case 'duplicate':{const t=clone(current());t.id=uid();t.name+=' copy';job[t.kind==='tree'?'trees':t.kind==='roofline'?'rooflines':'elements'].push(t);selected=t.id;touch();render();break;}case 'delete':if(confirm('Remove this item, photos and pins?')){for(const k of ['trees','rooflines','elements'])job[k]=job[k].filter(t=>t.id!==selected);selected=null;touch();render();}break;case 'newcustomer':job.customer=blank().customer;touch();render();break;case 'completecustomer':{if(job.customer.type==='Commercial'&&!job.customer.contact.trim())throw Error('Enter the commercial contact.');if(!job.customer.sameBilling&&!job.customer.billingAddress.trim())throw Error('Enter the billing address.');if(job.customer.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(job.customer.email))throw Error('Check the email address.');let entry=addCustomer(book,job.customer);if(store(BOOK,book)){job.customer.id=entry.id;touch();render();toast('Customer completed. One book entry; duplicates reuse the existing entry.');}break;}case 'save':save();break;case 'savestock':if(store(STOCK,stock))toast('Stock ledger saved.');break;case 'export':download('cityscape-full-job.json',exportObject());break;case 'rawexport':download('original-storage-backup.json',rawText||'null');break;case 'bundle':download('cityscape-workspace-backup.json',{format:'north-pole-workspace',job:exportObject(),customerBook:book,stock,scheduled,originalRaw:rawText});break;case 'newjob':if(!dirty||confirm('Discard unsaved working changes? Export first if needed.')){job=blank();selected=null;touch();render();}break;case 'print':window.print();break;case 'schedule':if(!job.date)throw Error('Set a scheduled date in Save / export first.');scheduled=scheduled.filter(j=>j.id!==job.id);scheduled.push(clone(job));store(JOBS,scheduled);render();toast('Scheduled demand updated.');break;case 'unschedule':scheduled=scheduled.filter(j=>j.id!==job.id);store(JOBS,scheduled);render();break;case 'orderscsv':download('supplier-order-list.csv',csv([['Supplier','Product','To order / book','Type'],...demandRows().filter(r=>r.need||r.booking&&(r.current+r.coming)).map(r=>[r.supplier,r.product,r.booking?r.current+r.coming:r.need,r.booking?'Booking':'Purchase'])]),'text/csv');break;case 'takeoffcsv':download('crew-takeoff.csv',csv([['Supplier','Product','Quantity','Where'],...[...totals(job).materials,...totals(job).labour].map(l=>[l.supplier,l.product,l.quantity,l.where])]),'text/csv');break;case 'lookup':await cityLookup();break;}}catch(e){toast(e.message);}}
function openMap(which){let address=job.customer.siteAddress?.trim();if(!address){address=prompt('Enter the job site address');if(!address?.trim())return;job.customer.siteAddress=address.trim();touch();}address=job.customer.siteAddress;const q=encodeURIComponent(address);if(which==='geo'){window.open('https://maps.ottawa.ca/geoOttawa/','_blank','noopener');let panel=$('#addressPanel');if(!panel){panel=document.createElement('div');panel.id='addressPanel';$('#app .sheet').prepend(panel);}if(panel)panel.innerHTML=`<label>Copy into GeoOttawa<input readonly value="${esc(address)}" onclick="this.select()"></label>`;else toast('GeoOttawa: search this preserved address: '+address);navigator.clipboard?.writeText(address).catch(()=>{});}else window.open(which==='google'?'https://www.google.com/maps/search/?api=1&query='+q:'https://earth.google.com/web/search/'+q,'_blank','noopener');}
async function cityLookup(){const mode=$('#lookupMode').value,val=$('#lookupValue').value.trim();if(!val)throw Error('Enter a street, TREEID or coordinates.');const safe=val.replace(/'/g,"''").toUpperCase(),p=new URLSearchParams({f:'json',where:'1=1',outFields:'OBJECTID,TREEID,GLOBALID,SPECIES,DBH,ADDNUM,ADDSTR,LTLOCATION,RDLOCATION,OWNERSHIP,STATUS,FLAG,MODIFYDATE',returnGeometry:'true',outSR:'4326',resultRecordCount:'200',orderByFields:'OBJECTID'});if(mode==='Street contains')p.set('where',"UPPER(ADDSTR) LIKE '%"+safe.replace(/[%_]/g,'')+"%'");else if(mode==='TREEID exact')p.set('where',"UPPER(TREEID) = '"+safe+"'");else {const [lat,lon]=val.split(',').map(Number);if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)throw Error('Use latitude, longitude in decimal degrees.');p.set('geometry',JSON.stringify({x:lon,y:lat,spatialReference:{wkid:4326}}));p.set('geometryType','esriGeometryPoint');p.set('inSR','4326');p.set('spatialRel','esriSpatialRelIntersects');p.set('distance',String(Math.min(1000,n($('#radius').value)||100)));p.set('units','esriSRUnit_Meter');}
$('#lookupInfo').textContent='Contacting City layer…';let results=[],more=true;try{while(more&&results.length<1000){p.set('resultOffset',String(results.length));const res=await fetch(CITY+'/query?'+p,{signal:AbortSignal.timeout(20000)});if(!res.ok)throw Error('HTTP '+res.status);const v=await res.json();if(v.error)throw Error(v.error.message);if(!Array.isArray(v.features))throw Error('Unexpected City response');results.push(...v.features);more=!!v.exceededTransferLimit&&v.features.length>0;}lookup=results.map(f=>({...f,_retrievedAt:new Date().toISOString(),_query:mode+': '+val}));lookupInfo=`${results.length} City records returned at ${new Date().toISOString()}.${more?' TRUNCATED at 1,000; narrow your search.':''} Confirm each location / record before adding.`;render();}catch(e){$('#lookupInfo').textContent='Lookup failed: '+e.message+'. No success claimed. Try a local City JSON extract or GeoOttawa.';}}
async function compress(file){if(!file.type.startsWith('image/'))throw Error('Choose an image.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const s=Math.min(1,1600/img.width,1600/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8);}finally{URL.revokeObjectURL(url);}}
