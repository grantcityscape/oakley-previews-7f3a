  --bg:#FDFBF7; --panel:#FFFFFF; --panel2:#F7F1E3; --inset:#FBF7EC;
  --ink:#16222E; --mut:#5C6B7A; --faint:#93A1AE;
  --navy:#0A2540; --navy2:#10365C;
  --gold:#B5752E; --gold2:#DA9949; --goldsoft:#F3E3C8;
  --line:#E3D9C3; --line2:#EFE7D2;
  --ok:#1E7A46; --att:#B3261E; --pend:#68798A;
  --okbg:#E7F3EC; --attbg:#FAECEA; --pendbg:#EEF1F4;
  --chip:#F1E9D6; --shadow:0 1px 3px rgba(10,37,64,.12);
  --head-bg:#FFFFFF; --rail-bg:#FBF7EC;
  --serif:Georgia,'Times New Roman',Times,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#081C33; --panel:#0E2C4E; --panel2:#0A2540; --inset:#0B2440;
  --ink:#F0E9D8; --mut:#B9C4CE; --faint:#7E93A8;
  --navy:#0A2540; --navy2:#16406E;
  --gold:#DA9949; --gold2:#E8B36A; --goldsoft:#3A2C14;
  --line:#1E4066; --line2:#17345A;
  --ok:#4CC07E; --att:#F0938B; --pend:#A9BAC9;
  --okbg:#12382A; --attbg:#47211E; --pendbg:#1B3350;
  --chip:#17345A; --shadow:0 1px 3px rgba(0,0,0,.5);
  --head-bg:#0A2540; --rail-bg:#0A2540;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; color:var(--ink); font:14px/1.45 var(--sans); background:var(--bg); display:flex; flex-direction:column; overflow:hidden}
button{font:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 9px; min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold); outline-offset:0}
a{color:var(--gold)}
h1,h2,h3{margin:0; font-family:var(--serif); font-weight:700; color:var(--navy); letter-spacing:.01em}
html[data-theme="dark"] h1,html[data-theme="dark"] h2,html[data-theme="dark"] h3{color:var(--ink)}
.small{font-size:12px} .mut{color:var(--mut)} .tiny{font-size:11px} .bold{font-weight:650}
.serif{font-family:var(--serif)}
/* ---------- opening ---------- */
#opening{position:fixed; inset:0; z-index:80; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; cursor:pointer; background:var(--navy); overflow:hidden}
#opening .hero-bg{position:absolute; inset:0; background-image:var(--hero); background-size:cover; background-position:center; opacity:.28}
#opening .veil{position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,37,64,.55), rgba(10,37,64,.88))}
#opening .ocard{position:relative; text-align:center; padding:26px 34px; max-width:520px}
#opening .ologo{width:230px; max-width:64vw; background:#FDFBF7; border-radius:14px; padding:12px 16px; box-shadow:0 8px 30px rgba(0,0,0,.35); animation:ofade 1s ease both}
#opening .otag{color:#F3E3C8; letter-spacing:.3em; font-size:11px; text-transform:uppercase; margin-top:18px; animation:ofade 1s .25s ease both}
#opening .orule{height:2px; width:0; background:var(--gold2); margin:14px auto 0; animation:orule 1.1s .45s ease forwards}
#opening .odial{margin:16px auto 0; width:44px; height:44px; animation:ofade 1s .6s ease both}
#opening .oskip{position:relative; color:#D8C9A8; font-size:12px; border:1px solid rgba(218,153,73,.55); padding:5px 16px; border-radius:999px; background:rgba(10,37,64,.5)}
@keyframes ofade{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@keyframes orule{to{width:180px}}
/* ---------- header ---------- */
header{display:flex; align-items:center; gap:12px; padding:8px 14px; background:var(--head-bg); border-bottom:2px solid var(--gold); flex:0 0 auto; z-index:5}
header .hlogo{height:40px; display:block}
header .hname{font-family:var(--serif); font-weight:700; font-size:17px; color:var(--navy); line-height:1.1}
html[data-theme="dark"] header .hname{color:var(--ink)}
header .hsub{font-size:11px; color:var(--mut); letter-spacing:.06em}
header .sp{flex:1}
.hbtn{border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:999px; padding:6px 13px; font-size:12.5px}
.hbtn:hover{border-color:var(--gold)}
.switchwrap{position:relative}
.switchmenu{position:absolute; right:0; top:calc(100% + 6px); background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(10,37,64,.22); padding:8px; min-width:230px; z-index:40}
.switchmenu button{display:flex; width:100%; text-align:left; border:0; background:none; padding:8px 10px; border-radius:8px; color:var(--ink); align-items:center; gap:8px}
.switchmenu button:hover{background:var(--panel2)}
.switchmenu .cur{margin-left:auto; font-size:10px; color:var(--gold); font-weight:700; letter-spacing:.08em}
/* ---------- layout ---------- */
#shell{flex:1; display:flex; min-height:0}
nav#rail{flex:0 0 172px; background:var(--rail-bg); border-right:1px solid var(--line); padding:12px 10px; display:flex; flex-direction:column; gap:6px; overflow-y:auto}
nav#rail button{border:1px solid transparent; background:none; color:var(--ink); text-align:left; padding:8px 13px; border-radius:999px; font-size:13.5px; display:flex; align-items:center; gap:8px}
nav#rail button:hover{border-color:var(--line)}
nav#rail button.on{background:var(--navy); color:#FDFBF7; font-weight:650}
nav#rail button .cnt{margin-left:auto; font-size:11px; background:var(--chip); color:var(--ink); border-radius:999px; padding:0 7px}
nav#rail button.on .cnt{background:rgba(253,251,247,.22); color:#FDFBF7}
main{flex:1; min-width:0; overflow-y:auto; padding:16px 18px 22px}
.view{display:none; max-width:1180px; margin:0 auto}
.view.on{display:block}
.vhead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.vhead h2{font-size:21px}
.vhead .sp{flex:1}
/* ---------- generic ---------- */
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow)}
.grid{display:grid; gap:12px}
.btn{border:1px solid var(--gold); background:var(--gold); color:#FFF9EE; border-radius:999px; padding:7px 15px; font-weight:650}
.btn.ghost{background:var(--panel); color:var(--gold)}
.btn.plain{border-color:var(--line); background:var(--panel); color:var(--ink); font-weight:500}
.btn.danger{border-color:var(--att); background:var(--panel); color:var(--att); font-weight:500}
.btn.small{padding:4px 11px; font-size:12.5px}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:.07em; padding:2px 9px; border-radius:999px; text-transform:uppercase}
.pill.sample{background:var(--goldsoft); color:var(--gold); border:1px solid var(--gold2)}
.pill.nc{background:var(--pendbg); color:var(--pend); border:1px solid var(--line)}
.pill.stage{background:var(--navy); color:#FDFBF7}
html[data-theme="dark"] .pill.stage{background:var(--gold); color:#0A2540}
.tag{font-size:11px; color:var(--mut)}
.notice{border:1.5px solid var(--gold); background:var(--inset); border-radius:12px; padding:12px 14px; font-size:13px}
.statusline{font-size:12px; color:var(--mut); min-height:16px}
.kv{display:grid; grid-template-columns:150px 1fr; gap:4px 12px; font-size:13.5px}
.kv dt{color:var(--mut)} .kv dd{margin:0}
label.fl{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mut)}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.row>*{flex:0 1 auto}
textarea{resize:vertical}
/* ---------- pipeline ---------- */
.blockstrip{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.blockcard{flex:1 1 200px; border:1px solid var(--att); background:var(--attbg); border-radius:12px; padding:10px 13px; font-size:13px}
.blockcard.ok{border-color:var(--line); background:var(--panel); color:var(--mut)}
.pipe{display:grid; grid-template-columns:repeat(5, minmax(168px,1fr)); gap:10px; align-items:start}
.pcol{background:var(--panel2); border:1px solid var(--line2); border-radius:14px; padding:10px; min-height:120px}
.pcol h3{font-size:13.5px; display:flex; align-items:center; gap:7px; font-family:var(--sans); letter-spacing:.02em}
.pcol h3 .n{margin-left:auto; background:var(--navy); color:#FDFBF7; font-size:11px; border-radius:999px; padding:0 8px}
html[data-theme="dark"] .pcol h3 .n{background:var(--gold); color:#0A2540}
.fcard{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:10px; padding:9px 11px; margin-top:9px; cursor:pointer; box-shadow:var(--shadow)}
.fcard:hover{border-color:var(--gold)}
.fcard .fn{font-weight:650; font-size:13.5px}
.fcard .fm{font-size:12px; color:var(--mut); margin-top:2px}
.fcard .fd{margin-top:6px; display:flex; gap:5px; flex-wrap:wrap}
/* ---------- doc states ---------- */
.dst{font-size:10.5px; font-weight:700; letter-spacing:.05em; padding:2px 8px; border-radius:999px; text-transform:uppercase; white-space:nowrap}
.dst.accepted{background:var(--okbg); color:var(--ok); border:1px solid var(--ok)}
.dst.attention{background:var(--attbg); color:var(--att); border:1px solid var(--att)}
.dst.pending{background:var(--pendbg); color:var(--pend); border:1px solid var(--pend)}
.docrow{display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--line2); border-radius:10px; margin-top:7px; cursor:pointer; background:var(--panel)}
.docrow:hover{border-color:var(--gold)}
.docrow.sel{border-color:var(--gold); background:var(--inset)}
.docrow .dn{flex:1; font-size:13.5px}
.statecounts{display:flex; gap:8px; flex-wrap:wrap}
.statecounts .sc{border:1px solid var(--line); border-radius:10px; padding:7px 11px; font-size:12.5px; background:var(--panel)}
.checkline{display:flex; gap:9px; align-items:flex-start; padding:6px 0; border-bottom:1px dashed var(--line2); font-size:13.5px}
.checkline:last-child{border-bottom:0}
.checkline .box{flex:0 0 auto; width:17px; height:17px; border:1.5px solid var(--gold); border-radius:5px; margin-top:1px; display:inline-flex; align-items:center; justify-content:center; color:var(--gold); font-size:12px; background:var(--panel); cursor:pointer}
.checkline.done .box{background:var(--gold); color:#FFF9EE}
.checkline .when{margin-left:auto; font-size:11.5px; color:var(--mut); white-space:nowrap}
.timeline{border-left:2px solid var(--line); margin-left:5px; padding-left:14px}
.timeline .te{position:relative; padding:5px 0 9px}
.timeline .te::before{content:""; position:absolute; left:-19.5px; top:10px; width:8px; height:8px; border-radius:50%; background:var(--gold); border:2px solid var(--panel)}
/* ---------- calendar ---------- */
.calwrap{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(230px,1fr); gap:12px; align-items:start}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px}
.calgrid .dow{font-size:11px; color:var(--mut); text-align:center; font-weight:700; letter-spacing:.06em; padding:3px 0}
.calday{border:1px solid var(--line2); border-radius:9px; min-height:64px; padding:4px; background:var(--panel); overflow:hidden}
.calday.dim{opacity:.42}
.calday.today{border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold)}
.calday .dnum{font-size:11px; font-weight:700; color:var(--mut)}
.calday .ev{display:block; width:100%; margin-top:3px; background:var(--navy); color:#FDFBF7; border-radius:6px; padding:2px 5px; font-size:10.5px; line-height:1.25; white-space:normal; word-break:break-word; cursor:pointer}
html[data-theme="dark"] .calday .ev{background:var(--gold); color:#0A2540}
.calday .ev.fu{background:var(--goldsoft); color:var(--gold); border:1px solid var(--gold2)}
.calnav{display:flex; align-items:center; gap:10px}
.calnav h3{font-size:16px}
/* ---------- tables/lists ---------- */
.listrow{display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--panel); margin-top:8px; cursor:pointer}
.listrow:hover{border-color:var(--gold)}
.listrow .grow{flex:1; min-width:0}
.acctcard{display:flex; gap:12px; align-items:center}
.acctcard .ic{width:38px; height:38px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:700; color:var(--navy)}
html[data-theme="dark"] .acctcard .ic{color:var(--gold2)}
.draftrow{border:1px solid var(--line); border-radius:12px; padding:11px 13px; background:var(--panel); margin-top:9px}
.draftrow .acts{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px}
.gallery{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px}
.gallery figure{margin:0; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.gallery img{width:100%; height:130px; object-fit:cover; display:block}
.gallery figcaption{padding:8px 11px; font-size:12px; color:var(--mut)}
.heroband{border-radius:14px; overflow:hidden; border:1px solid var(--line); position:relative; min-height:150px; display:flex; align-items:flex-end; background:var(--navy)}
.heroband img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.5}
.heroband .hb{position:relative; padding:14px 16px; color:#FDFBF7}
.heroband .hb .t1{font-family:var(--serif); font-size:19px; font-weight:700}
.heroband .hb .t2{font-size:11.5px; letter-spacing:.22em; color:#F3E3C8}
/* ---------- footer / toast ---------- */
footer{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:6px 14px; border-top:1px solid var(--line); background:var(--head-bg); font-size:11px; font-weight:500; color:var(--mut)}
footer .sp{flex:1}
#toast{position:fixed; left:50%; bottom:52px; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#FDFBF7; border:1px solid var(--gold2); border-radius:14px; padding:12px 18px; display:flex; gap:12px; align-items:center; opacity:0; pointer-events:none; transition:all .25s ease; z-index:70; max-width:min(92vw,560px); box-shadow:0 12px 34px rgba(10,37,64,.35)}
#toast.show{opacity:1; transform:translateX(-50%)}
#toast .dial{flex:0 0 auto; animation:dialspin .55s ease}
@keyframes dialspin{from{transform:rotate(0deg)} to{transform:rotate(280deg)}}
#toast .tt{font-weight:700; font-family:var(--serif)}
#toast .ts{font-size:12px; color:#E8DCC2}
@media (max-width:760px){
  header{flex-wrap:wrap; row-gap:6px}
  header .hlogo{height:30px}
  header .hname{font-size:15px}
  .hbtn{padding:5px 10px; font-size:12px}
  footer{flex-wrap:wrap; row-gap:2px}
  nav#rail{flex-direction:row; flex:0 0 auto; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden; padding:8px}
  #shell{flex-direction:column}
  nav#rail button{white-space:nowrap}
  .pipe{grid-template-columns:repeat(5,minmax(150px,1fr)); overflow-x:auto; padding-bottom:6px}
  .calwrap{grid-template-columns:1fr}
  header .hsub{display:none}
  .kv{grid-template-columns:118px 1fr}
}
</style>
</head>

/* ============================== store ============================== */
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); storeOk=true; }
  catch(e){ storeOk=false; }
  footStatus();
}
function persistSocial(){
  try{ localStorage.setItem(SKEY, JSON.stringify(social)); }
  catch(e){ /* social drafts are secondary; failure surfaces via main status */ }
}
function loadStore(){
  var raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){ raw=null; }
  if(raw){
    try{ store=JSON.parse(raw); if(!store || !Array.isArray(store.files)) throw new Error('shape'); }
    catch(e){
      store=seedStore();
      try{ localStorage.setItem(KEY, JSON.stringify(store)); storeOk=true; }
      catch(e2){ storeOk=false; }
    }
  } else {
    store=seedStore();
    try{ localStorage.setItem(KEY, JSON.stringify(store)); storeOk=true; }
    catch(e){ storeOk=false; }
  }
  var sraw=null;
  try{ sraw=localStorage.getItem(SKEY); }catch(e){ sraw=null; }
  if(sraw){ try{ social=JSON.parse(sraw); if(!social || !Array.isArray(social.drafts)) throw new Error('shape'); }catch(e){ social=seedSocial(); persistSocial(); } }
  else { social=seedSocial(); persistSocial(); }
}
function footStatus(){
  var el=document.getElementById('footstatus');
  if(el) el.textContent = storeOk ? 'Standalone workspace — records saved on this device' : 'Storage unavailable — changes are NOT being saved';
}
function fileById(id){ for(var i=0;i<store.files.length;i++) if(store.files[i].id===id) return store.files[i]; return null; }
function docCounts(f){
  var c={accepted:0,'needs attention':0,pending:0};
  f.docs.forEach(function(d){ if(c.hasOwnProperty(d.state)) c[d.state]++; });
  return c;
}
function stateCountsHtml(f){
  var c=docCounts(f);
  return '<div class="statecounts">'
    +'<span class="sc"><span class="dst accepted">Accepted</span> <b>'+c.accepted+'</b></span>'
    +'<span class="sc"><span class="dst attention">Needs attention</span> <b>'+c['needs attention']+'</b></span>'
    +'<span class="sc"><span class="dst pending">Pending</span> <b>'+c.pending+'</b></span></div>';
}
function blockingDocs(f){ return f.docs.filter(function(d){ return d.state==='needs attention'; }); }
function nextSteps(f){
  var out=[];
  f.docs.forEach(function(d){ if(d.state!=='accepted') out.push('Document: '+d.name+' — '+DSTATE_LABEL[d.state].toLowerCase()); });
  f.miles.forEach(function(m){ if(!m.done) out.push('Milestone: '+m.label); });
  return out;
}

function selectDoc(id){ curDocId=id; renderFile(); }
function addTrail(f, text){ f.trail.unshift({id:uid('tr'), date:todayStr(), text:text}); }
function setDocState(docId, state){
  var f=fileById(curFileId); if(!f) return;
  var d=docById(f, docId); if(!d || d.state===state) return;
  var old=d.state; d.state=state; d.updated=todayStr();
  if(state==='needs attention' && !d.note) d.note='Flagged as needing attention — reason not yet recorded.';
  addTrail(f, 'Document state recorded: '+d.name+' \u2192 '+DSTATE_LABEL[state].toLowerCase()+'.');
  persist(); renderFile(); renderRail();
}
function editDocNote(docId){
  var f=fileById(curFileId); if(!f) return;

  d.note=note; d.updated=todayStr(); persist(); renderFile();
}
function addDoc(){
  var f=fileById(curFileId); if(!f) return;
  var name=prompt('Document name:'); if(!name) return;
  var d=mkDoc(name,'pending','',todayStr()); f.docs.push(d); curDocId=d.id;
  addTrail(f, 'Document added to checklist: '+name+'.'); persist(); renderFile(); renderRail();
}
function removeDoc(docId){
  var f=fileById(curFileId); if(!f) return;
  var d=docById(f, docId); if(!d) return;
  if(!confirm('Remove \u201C'+d.name+'\u201D from the checklist? Its recorded state stays in the compliance trail.')) return;
  f.docs=f.docs.filter(function(x){ return x.id!==docId; });
  addTrail(f, 'Document removed from checklist: '+d.name+' (was '+DSTATE_LABEL[d.state].toLowerCase()+').');
  curDocId=f.docs.length?f.docs[0].id:null; persist(); renderFile(); renderRail();
}
function toggleMile(mid){
  var f=fileById(curFileId); if(!f) return;
  for(var i=0;i<f.miles.length;i++){ if(f.miles[i].id===mid){ var m=f.miles[i]; m.done=!m.done; m.date=m.done?todayStr():''; addTrail(f,'Milestone '+(m.done?'recorded complete':'re-opened')+': '+m.label+'.'); break; } }
  persist(); renderFile();
}
function toggleFollow(fid){

/* ============================== calendar ============================== */
function calEvents(){
  var evs=[];
  store.appts.forEach(function(a){ evs.push({date:a.date, label:(a.time?a.time+' ':'')+a.label, fileId:a.fileId, kind:'appt', id:a.id}); });
  store.files.forEach(function(f){ f.followups.forEach(function(u){ if(!u.done) evs.push({date:u.date, label:u.label, fileId:f.id, kind:'fu', id:u.id}); }); });
  return evs;
}
function renderCalendar(){
  if(!calCursor){ var t=new Date(); calCursor={y:t.getFullYear(), m:t.getMonth()}; }
  var y=calCursor.y, m=calCursor.m;
  var first=new Date(y,m,1), startDay=first.getDay(), days=new Date(y,m+1,0).getDate();
  var prevDays=new Date(y,m,0).getDate();
  var M=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var evs=calEvents();
  function evsOn(ds){ return evs.filter(function(e){ return e.date===ds; }); }
  var cells='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d){ cells+='<div class="dow">'+d+'</div>'; });
  var total=Math.ceil((startDay+days)/7)*7, today=todayStr();
  for(var i=0;i<total;i++){
    var dayNum, ds, dim=false;
    if(i<startDay){ dayNum=prevDays-startDay+1+i; var pm=new Date(y,m-1,dayNum); ds=pm.getFullYear()+'-'+String(pm.getMonth()+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0'); dim=true; }
    else if(i>=startDay+days){ dayNum=i-startDay-days+1; var nm=new Date(y,m+1,dayNum); ds=nm.getFullYear()+'-'+String(nm.getMonth()+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0'); dim=true; }
    else { dayNum=i-startDay+1; ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dayNum).padStart(2,'0'); }
    var dayEvs=evsOn(ds);
    cells+='<div class="calday'+(dim?' dim':'')+(ds===today?' today':'')+'"><span class="dnum">'+dayNum+'</span>'
      + dayEvs.map(function(e){ return '<span class="ev'+(e.kind==='fu'?' fu':'')+'" title="'+esc(e.label)+'" onclick="openFile(\''+e.fileId+'\')">'+esc(e.label)+'</span>'; }).join('')
      +'</div>';
  }
  var upcoming=evs.filter(function(e){ return e.date>=today; }).sort(function(a,b){ return a.date<b.date?-1:1; }).slice(0,10);
  document.getElementById('view-calendar').innerHTML='<div class="vhead"><h2>Calendar</h2><span class="small mut">Appointments and open follow-ups, recorded on this device.</span><div class="sp"></div><button class="btn" onclick="addAppt()">New appointment</button></div>'
    +'<div class="calwrap"><div class="card"><div class="calnav"><button class="btn plain small" onclick="calShift(-1)">←</button><h3>'+M[m]+' '+y+'</h3><button class="btn plain small" onclick="calShift(1)">→</button><div class="sp" style="flex:1"></div><button class="btn plain small" onclick="calToday()">Today</button></div>'
    +'<div class="calgrid" style="margin-top:10px">'+cells+'</div>'
    +'<p class="tiny mut" style="margin-top:8px">Gold pills are follow-ups; navy pills are appointments. Tap an item to open its file.</p></div>'
    +'<div class="card"><h3 style="font-size:15px">Upcoming</h3>'
    +(upcoming.length? upcoming.map(function(e){
        var f=fileById(e.fileId);
        return '<div class="docrow" onclick="openFile(\''+e.fileId+'\')"><span class="dn">'+esc(e.label)+'</span><span class="tag">'+fmtDate(e.date)+(f?' · '+esc(f.client):'')+'</span></div>';
      }).join('') : '<p class="mut small" style="margin-top:6px">Nothing upcoming is recorded.</p>')
    +'</div></div>';
}
function calShift(n){ calCursor.m+=n; if(calCursor.m<0){ calCursor.m=11; calCursor.y--; } if(calCursor.m>11){ calCursor.m=0; calCursor.y++; } renderCalendar(); }
function calToday(){ var t=new Date(); calCursor={y:t.getFullYear(), m:t.getMonth()}; renderCalendar(); }
function addAppt(){
  var label=prompt('Appointment:'); if(!label) return;
  var date=prompt('Date (YYYY-MM-DD):', todayStr()); if(date===null) return;
  var time=prompt('Time (e.g. 10:00):',''); if(time===null) return;
  var fid=prompt('Link to file ID (leave blank for none):',''); if(fid===null) return;
  store.appts.push({id:uid('ap'), date:date||todayStr(), time:time||'', label:label, fileId:(fid&&fileById(fid))?fid:''});
  persist(); renderCalendar();
}

function saveAccount(){
  store.accounts={provider:document.getElementById('ac-provider').value, label:document.getElementById('ac-label').value.trim(), address:document.getElementById('ac-address').value.trim()};
  persist(); renderAccounts();
  toast('Account record saved', 'Recorded locally. The live link activates in the full Canopy shell.');
}
function exportJSON(){
  var payload=JSON.stringify({app:'8Twelve Mortgages', key:KEY, exported:todayStr(), store:store, social:social}, null, 2);
  var blob=new Blob([payload], {type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='8twelve-backup.json'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}
function importJSON(input){
  var file=input.files && input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      var s=data.store||data;
      if(!s || !Array.isArray(s.files) || !Array.isArray(s.clients)) throw new Error('shape');
      store=s;
      if(data.social && Array.isArray(data.social.drafts)) social=data.social;
      persist(); persistSocial(); curFileId=null; editClientId=null; editDraftId=null;
      switchView('pipeline');
      toast('Backup restored', 'The records on this device now match the backup copy.');
    }catch(e){
      var st=document.getElementById('acct-status'); if(st) st.textContent='That file is not a valid 8Twelve backup — nothing was changed.';
    }
  };
  reader.readAsText(file);
  input.value='';
}
function removeSamples(){
  if(!confirm('Remove the sample files, clients and drafts from this device? Anything you added yourself stays.')) return;
  store.files=store.files.filter(function(f){ return !f.sample; });
  store.clients=store.clients.filter(function(c){ return !c.sample; });
  store.drafts=store.drafts.filter(function(d){ return !d.sample; });
  social.drafts=social.drafts.filter(function(d){ return !d.sample; });
  store.samplesRemoved=true; curFileId=null;
  persist(); persistSocial(); switchView('pipeline');
}
function restoreSamples(){
  var seed=seedStore();
  seed.files.forEach(function(sf){ if(!fileById(sf.id)) store.files.push(sf); });
  seed.clients.forEach(function(sc){ if(!store.clients.some(function(c){ return c.id===sc.id; })) store.clients.push(sc); });
  seed.drafts.forEach(function(sd){ if(!store.drafts.some(function(d){ return d.id===sd.id; })) store.drafts.push(sd); });
  var ss=seedSocial();
  ss.drafts.forEach(function(sd){ if(!social.drafts.some(function(d){ return d.text===sd.text; })) social.drafts.push(sd); });
  store.samplesRemoved=false;
  persist(); persistSocial(); switchView('pipeline');
  toast('Sample records restored', 'The sample files are back on this device.');
}
