<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbench — Canopy v1.2.1</title><meta name="theme-color" content="#08101d"><link rel="icon" href="data:,">
<style>/* WORKBENCH v1.2.1 — the Canopy work surface. Blue (59 130 246 family) is Workbench's frame; every business card keeps its own colours. */
:root{--void:#04080f;--hull:#08101d;--cell:#0d1829;--well:#122036;--ld:#1c2e4a;--lh:#2c4366;

--wb:59 130 246;--wbi:147 190 255;--brass:226 180 96;--ok:52 211 153;--pv:251 191 36;--ex:34 211 238;--nb:156 170 190;--cr:248 113 113;
--deck:30 77 43;--deckl:108 133 116;--day:239 68 68;--gold:250 204 21;--silver:197 205 216;
--ct:2.75rem;

--bg:radial-gradient(ellipse 70% 40% at 50% -10%,rgb(var(--wb)/.16),transparent 70%),radial-gradient(ellipse 130% 95% at 50% 50%,transparent 58%,rgb(0 0 0/.55) 100%),repeating-linear-gradient(0deg,rgb(160 190 235/.018) 0 .0625rem,transparent .0625rem .3rem),linear-gradient(180deg,#07101e,#03070d);
--pegdot:rgb(120 160 220/.16);--cardbg:linear-gradient(180deg,#101c30,#0a1424);--cardhi:rgb(255 255 255/.07);--shadow:rgb(0 0 0/.55);
--doorbg:linear-gradient(180deg,#0f1722,#080d15)}
html[data-theme=light]{--void:#e7edf6;--hull:#f2f6fc;--cell:#ffffff;--well:#e8eff9;--ld:#c3d1e6;--lh:#9db2d1;
--tmax:#06122a;--tp:#0e1c36;--ts:#364a68;--tm:#52678a;--ink:#06122a;
--wb:37 99 235;--wbi:30 64 175;--brass:150 100 20;--ok:5 150 105;--pv:180 100 0;--ex:8 130 160;--cr:200 40 40;
--silver:90 104 126;--deckl:30 77 43;--gold:160 120 0;
--bg:radial-gradient(ellipse 70% 40% at 50% -10%,rgb(var(--wb)/.12),transparent 70%),repeating-linear-gradient(0deg,rgb(40 70 120/.03) 0 .0625rem,transparent .0625rem .3rem),linear-gradient(180deg,#eef3fb,#dde6f3);
--pegdot:rgb(40 80 150/.20);--cardbg:linear-gradient(180deg,#ffffff,#eef3fb);--cardhi:rgb(255 255 255/.9);--shadow:rgb(20 40 80/.22);
--doorbg:linear-gradient(180deg,#ffffff,#e9f0fa)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--tp);font:400 .75rem/1.25 var(--fs);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html{font-size:16px}@media(min-width:2400px){html{font-size:24px}}
button,input,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;text-align:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid rgb(var(--wbi));outline-offset:-2px}[hidden]{display:none!important}
.num{font-family:var(--fm)}
.bench{display:grid;width:100%;height:100%;padding:.3rem;gap:.3rem;grid-template-rows:2.9rem minmax(0,1fr) var(--ct);background:var(--bg)}
/* ---------- header: the masthead is the approved Northbirch lockup (Canopy's logo); the section doors sit beside it, smaller (Grant's ruling 2026-11-18) ---------- */
.top{display:grid;grid-template-columns:2.9rem auto 17.8rem minmax(0,1fr);gap:.4rem;min-width:0}
.lockup{border-radius:.3rem;overflow:hidden;line-height:0}
.lockup svg{height:2.9rem;width:auto;display:block}
.hlogo{display:grid;place-items:center;border-radius:.3rem;border:1px solid var(--ld);background:var(--doorbg);cursor:pointer}.hlogo svg{width:2.1rem;height:2.1rem}.hlogo:hover{filter:brightness(1.15)}
.chrono{display:flex;align-items:center;justify-content:space-between;gap:.3rem;padding:0 .4rem;border-radius:.3rem;overflow:hidden;white-space:nowrap;border:1px solid var(--ld);border-left:3px solid rgb(var(--wb));background:linear-gradient(90deg,rgb(var(--wb)/.16),transparent 60%),var(--doorbg);cursor:pointer;box-shadow:-.2rem 0 1rem rgb(var(--wb)/.14)}
.chrono b{font:700 1.3rem/1.2 var(--fd);color:var(--tmax)}
.chrono span{display:flex;flex-direction:column;font:.7rem/1.15 var(--fm);color:var(--ts)}.chrono i{font-style:normal}
.doors{display:grid;gap:.4rem;grid-template-columns:repeat(2,minmax(0,1fr))}
.door{--d:var(--silver);position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.4rem;padding:0 .7rem;border-radius:.3rem;min-width:0;overflow:hidden;transition:box-shadow .15s,filter .15s;background:radial-gradient(120% 170% at 0% 0%,rgb(var(--d)/.32),transparent 55%),radial-gradient(80% 120% at 100% 100%,rgb(var(--d)/.10),transparent 60%),var(--doorbg);border:1px solid rgb(var(--d)/.38);border-bottom:2px solid rgb(var(--d));box-shadow:inset 0 1px 0 rgb(255 255 255/.07),0 0 0 1px rgb(0 0 0/.18),0 .25rem 1.2rem rgb(var(--d)/.14)}
.door::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgb(255 255 255/.022) 0 .08rem,transparent .08rem .5rem)}
.door:hover{filter:brightness(1.12);box-shadow:inset 0 1px 0 rgb(255 255 255/.08),0 0 0 1px rgb(0 0 0/.18),0 .25rem 1.4rem rgb(var(--d)/.3)}
#d-deck{--d:var(--deck)}#d-day{--d:var(--day);border-bottom-color:rgb(var(--gold))}#d-wb{--d:var(--wb)}
html:not([data-theme=light]) #d-deck{border-color:rgb(108 133 116/.55);border-bottom-color:#6C8574;background:radial-gradient(120% 170% at 0% 0%,#1E4D2B,transparent 60%),radial-gradient(80% 120% at 100% 100%,rgb(26 46 34/.9),transparent 60%),linear-gradient(180deg,#1A2E22,#0b0b0d);box-shadow:inset 0 1px 0 rgb(212 232 219/.1),0 0 0 1px rgb(0 0 0/.55),0 .25rem 1.2rem rgb(30 77 43/.4)}
html[data-theme=light] #d-deck{border-color:rgb(108 133 116/.55);border-bottom-color:#6C8574;background:radial-gradient(120% 170% at 0% 0%,rgb(var(--deck)/.34),transparent 58%),radial-gradient(80% 120% at 100% 100%,rgb(var(--deck)/.14),transparent 60%),linear-gradient(180deg,#f2f8f2,#d4e8db);box-shadow:inset 0 1px 0 rgb(255 255 255/.6),0 .25rem 1.2rem rgb(30 77 43/.25)}
.door .in{min-width:0;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.door .nm{font:700 .9rem/1.2 var(--fd);letter-spacing:.1em;color:var(--tmax);white-space:nowrap;text-shadow:0 0 .8rem rgb(var(--d)/.65)}
html:not([data-theme=light]) #d-day .nm{color:#fde68a;text-shadow:0 0 .8rem rgb(var(--gold)/.45)}
.door .ln{font:.72rem/1.25 var(--fs);color:var(--ts);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.door .ln .nc{color:rgb(var(--d));border-color:rgb(var(--d)/.7);margin-right:.15rem}
#d-day .ln .nc{color:rgb(var(--gold));border-color:rgb(var(--gold)/.7)}
.door .go{font:700 .95rem var(--fm);color:rgb(var(--d));position:relative;z-index:1;text-shadow:0 0 .6rem rgb(var(--d)/.7)}
#d-day .go{color:rgb(var(--gold))}
.door.on{cursor:default;background:radial-gradient(120% 190% at 0% 0%,rgb(var(--d)/.55),transparent 62%),var(--doorbg);border-color:rgb(var(--wbi)/.8);border-bottom:3px solid rgb(var(--wbi));box-shadow:0 .25rem 1.6rem rgb(var(--d)/.4)}
/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;gap:.3rem;min-height:0;min-width:0}
.pic{display:flex;align-items:center;gap:.6rem;min-height:2.5rem;padding:0 .3rem;flex:none}
.pic .ttl{display:flex;flex-direction:column;min-width:0;flex:none}
.pic .eb{font:700 .62rem/1 var(--fm);letter-spacing:.22em;color:rgb(var(--wbi))}
.pic .h1{font:700 1.15rem/1.15 var(--fd);letter-spacing:.06em;color:var(--tmax);white-space:nowrap}
.chips{display:flex;gap:.35rem;flex:1;min-width:0;align-items:center;flex-wrap:nowrap;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .5rem;border-radius:.25rem;border:1px solid rgb(var(--c)/.55);background:rgb(var(--c)/.12);font:700 .68rem/1 var(--fm);letter-spacing:.08em;color:var(--tp);white-space:nowrap}
.chip b{font:700 .9rem/1 var(--fd);color:var(--tmax)}.chip::before{content:'';width:.5rem;height:.5rem;border-radius:50%;background:rgb(var(--c));box-shadow:0 0 .5rem rgb(var(--c)/.8)}
.chip.nb::before{background:repeating-linear-gradient(45deg,rgb(var(--c)) 0 2px,transparent 2px 4px);box-shadow:none}
.pic .rt{display:flex;align-items:center;gap:.3rem;flex:none}
.pager{display:flex;align-items:center;gap:.2rem;font:700 .7rem var(--fm);color:var(--ts)}
.ib{display:grid;place-items:center;min-width:2.75rem;height:2.75rem;border-radius:.3rem;color:var(--ts)}.ib:hover{color:var(--tmax);background:rgb(var(--wb)/.15)}
.egg{opacity:.5;transition:opacity .2s}.egg:hover,.egg:focus-visible{opacity:1}.egg svg{width:1.5rem;height:1.5rem}
.shelf{position:relative;flex:1;min-height:0;border-radius:.45rem;overflow:hidden;border:1px solid var(--ld);padding:.55rem;display:grid;align-content:center;justify-content:center;gap:.7rem;
 background:radial-gradient(circle at center,var(--pegdot) .07rem,transparent .09rem) 0 0/1.1rem 1.1rem,linear-gradient(180deg,rgb(var(--wb)/.05),transparent 40%),var(--hull);box-shadow:inset 0 .1rem 1.4rem rgb(0 0 0/.25)}
html[data-theme=light] .shelf{box-shadow:inset 0 .1rem .8rem rgb(20 40 80/.12)}
/* ---------- business card (a tag hung on the pegboard) ---------- */
.card{--c:var(--wb);position:relative;display:flex;flex-direction:column;gap:.22rem;min-width:0;min-height:0;overflow:hidden;padding:.45rem .6rem .45rem .8rem;border-radius:.4rem;text-align:left;
 background:radial-gradient(110% 80% at 0% 0%,rgb(var(--c)/.20),transparent 62%),var(--cardbg);border:1px solid rgb(var(--c)/.35);box-shadow:inset 0 1px 0 var(--cardhi),0 .3rem 1rem var(--shadow);transition:transform .15s,box-shadow .15s,border-color .15s}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:.28rem;background:rgb(var(--c));box-shadow:0 0 .8rem rgb(var(--c)/.7)}
.card::after{content:'';position:absolute;right:.5rem;top:.45rem;width:.5rem;height:.5rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgb(255 255 255/.5),rgb(var(--c)/.35) 45%,rgb(0 0 0/.5));box-shadow:inset 0 0 0 1px rgb(0 0 0/.35)}
.card:hover,.card:focus-visible{transform:translateY(-.15rem);border-color:rgb(var(--c)/.9);box-shadow:inset 0 1px 0 var(--cardhi),0 .5rem 1.6rem rgb(var(--c)/.35)}
.card .hd{display:flex;align-items:center;gap:.5rem;min-width:0;padding-right:.75rem}
.card .pl{flex:none;width:2.05rem;height:2.05rem;filter:drop-shadow(0 .15rem .4rem rgb(0 0 0/.4))}.card .pl svg{width:100%;height:100%;display:block}
.card .nm{font:700 .88rem/1.15 var(--fd);letter-spacing:.03em;color:var(--tmax);min-width:0;overflow-wrap:anywhere}
.card .ov{font:.74rem/1.3 var(--fs);color:var(--ts)}
.card .ab{display:none;font:.72rem/1.32 var(--fs);color:var(--tm)}
.card .fx{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:auto}
.fct{display:inline-flex;gap:.3rem;align-items:baseline;padding:.15rem .4rem;border-radius:.2rem;background:rgb(var(--c)/.12);border:1px solid rgb(var(--c)/.28);font:.66rem/1.15 var(--fm);color:var(--ts);white-space:nowrap}.fct b{font-weight:700;color:var(--tp)}.fct i{font-style:normal;font-size:.58rem;letter-spacing:.1em;color:var(--tm)}
.st{display:inline-flex;align-items:center;gap:.3rem;align-self:flex-start;padding:.14rem .42rem;border-radius:.2rem;font:700 .62rem/1.1 var(--fm);letter-spacing:.1em;white-space:nowrap;border:1px solid rgb(var(--s)/.7);color:rgb(var(--s));background:rgb(var(--s)/.12)}
.st.live{--s:var(--ok)}.st.preview{--s:var(--pv);border-style:dashed}.st.external{--s:var(--ex)}.st.nobuilt{--s:var(--nb);border-style:dotted;background:repeating-linear-gradient(135deg,rgb(var(--s)/.16) 0 .2rem,transparent .2rem .4rem)}.st.yours{--s:var(--wb)}.st.new{--s:var(--nb);border-style:dotted;background:repeating-linear-gradient(135deg,rgb(var(--s)/.16) 0 .2rem,transparent .2rem .4rem)}
.st.live::before{content:'';width:.4rem;height:.4rem;border-radius:50%;background:rgb(var(--s));box-shadow:0 0 .4rem rgb(var(--s))}
.card.t2 .ab{display:block}.card.t2 .pl{width:2.8rem;height:2.8rem}.card.t2 .nm{font-size:1.05rem}
.card.t3 .ab{display:block;font-size:.8rem}.card.t3 .pl{width:3.6rem;height:3.6rem}.card.t3 .nm{font-size:1.25rem}.card.t3 .ov{font-size:.85rem}.card.t3 .fct{font-size:.74rem;padding:.22rem .5rem}
.card.add{--c:var(--wb);border-style:dashed;background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--ts);gap:.35rem}.card.add .pl{display:grid;place-items:center;border:2px dashed rgb(var(--wb)/.7);border-radius:50%;font:700 1.4rem var(--fd);color:rgb(var(--wbi));filter:none}
.card.add::after,.card.add::before{display:none}.card.add .nm{color:rgb(var(--wbi))}
/* ---------- foot ---------- */
.foot{display:flex;align-items:center;gap:.5rem;min-width:0;padding:0 .3rem}
.seg{display:inline-flex;border:1px solid var(--ld);border-radius:.3rem;overflow:hidden;flex:none}.seg button{height:2.75rem;padding:0 .8rem;font:700 .7rem var(--fm);letter-spacing:.08em;color:var(--ts)}.seg button[aria-pressed=true]{background:rgb(var(--wb)/.3);color:var(--tmax);box-shadow:inset 0 -.18rem rgb(var(--wbi))}
.sv{flex:1;min-width:0;font:.68rem/1.2 var(--fm);color:var(--tm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sv.bad{color:rgb(var(--cr));font-weight:700}
.btn{display:inline-flex;align-items:center;gap:.4rem;height:2.75rem;padding:0 .9rem;border-radius:.3rem;font:700 .72rem var(--fm);letter-spacing:.1em;border:1px solid rgb(var(--wb)/.6);background:rgb(var(--wb)/.16);color:var(--tmax);white-space:nowrap;flex:none}.btn:hover{background:rgb(var(--wb)/.3)}.btn.q{border-color:var(--ld);background:transparent;color:var(--ts)}
.nc{display:inline-block;padding:.12rem .35rem;border-radius:.2rem;border:1px solid rgb(var(--pv)/.7);color:rgb(var(--pv));font:700 .58rem var(--fm);letter-spacing:.08em}
/* ---------- sheets ---------- */
.ov-b{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgb(2 6 14/.66);backdrop-filter:blur(3px);padding:1rem}
.sheet{width:min(34rem,100%);max-height:100%;display:flex;flex-direction:column;gap:.6rem;padding:1rem 1.1rem;border-radius:.5rem;border:1px solid rgb(var(--wb)/.6);background:var(--cell);box-shadow:0 1rem 3rem rgb(0 0 0/.5);overflow:hidden}
.sheet h2{font:700 1.1rem/1.2 var(--fd);letter-spacing:.05em;color:var(--tmax)}.sheet p{font:.8rem/1.4 var(--fs);color:var(--ts)}.sheet .row{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.sheet label{display:flex;flex-direction:column;gap:.2rem;font:700 .62rem var(--fm);letter-spacing:.12em;color:var(--tm)}
.sheet input[type=text],.sheet input[type=url]{height:2.4rem;padding:0 .6rem;border-radius:.3rem;border:1px solid var(--ld);background:var(--well);font:.8rem var(--fs);color:var(--tp)}
.subs{display:flex;flex-direction:column;gap:.35rem}.subs .sub{display:flex;gap:.5rem;align-items:baseline;padding:.4rem .55rem;border:1px solid var(--ld);border-radius:.3rem;background:var(--well)}.subs .sub b{font:700 .8rem var(--fd);color:var(--tp);white-space:nowrap}.subs .sub span{font:.75rem var(--fs);color:var(--ts)}.subs .sub em{margin-left:auto;font:700 .58rem var(--fm);font-style:normal;letter-spacing:.1em;color:var(--tm);white-space:nowrap}.subs .note{font:.72rem/1.35 var(--fs);color:var(--tm);padding:0 .2rem}
.sw{display:flex;gap:.4rem}.sw button{width:2.2rem;height:2.2rem;border-radius:50%;background:rgb(var(--c));border:2px solid transparent;box-shadow:inset 0 0 0 2px rgb(0 0 0/.3)}.sw button[aria-pressed=true]{border-color:var(--tmax)}
.err{color:rgb(var(--cr));font:700 .7rem var(--fm)}
.toast{position:fixed;left:50%;bottom:3.6rem;transform:translateX(-50%);z-index:60;max-width:min(36rem,92vw);padding:.55rem .8rem;border-radius:.3rem;background:var(--cell);border:1px solid rgb(var(--wb)/.7);font:.76rem/1.35 var(--fs);color:var(--tp);box-shadow:0 .6rem 2rem rgb(0 0 0/.5)}
/* ---------- opening ---------- */
#open{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(ellipse 80% 60% at 50% 40%,#0d2145,#03070f 75%);overflow:hidden;cursor:pointer;transition:opacity .5s}
#open.out{opacity:0;pointer-events:none}
#open::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at center,rgb(120 170 240/.2) .07rem,transparent .09rem) 0 0/1.3rem 1.3rem;mask:radial-gradient(ellipse 70% 60% at 50% 50%,#000,transparent 80%);-webkit-mask:radial-gradient(ellipse 70% 60% at 50% 50%,#000,transparent 80%)}
.os{position:relative;width:min(72rem,94vw);max-height:92vh;display:flex;flex-direction:column;align-items:center;gap:1rem}
.os svg.sc{width:100%;height:auto;max-height:46vh;display:block;overflow:visible}
.os .ln1{fill:none;stroke:rgb(147 190 255);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1s ease forwards}
.os .tl{fill:none;stroke:rgb(226 234 246/.85);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .9s ease forwards}
.os .tl.b{stroke:rgb(226 180 96)}
@keyframes dr{to{stroke-dashoffset:0}}
.os .pls{display:flex;gap:.6rem;align-items:flex-end;justify-content:center;flex-wrap:nowrap}
.os .pls .p{width:3.1rem;height:3.1rem;opacity:0;transform:translateY(-2.2rem) rotate(-6deg);animation:dp .5s cubic-bezier(.3,1.5,.5,1) forwards}.os .pls .p svg{width:100%;height:100%}
@keyframes dp{60%{opacity:1}to{opacity:1;transform:none}}
.os .wm{font:700 clamp(1.8rem,5vw,3.4rem)/1 var(--fd);letter-spacing:.5em;color:#f5f9ff;opacity:0;animation:wm 1.2s ease 3.1s forwards;text-shadow:0 0 2rem rgb(59 130 246/.8);padding-left:.5em}
@keyframes wm{from{opacity:0;letter-spacing:.9em;filter:blur(6px)}to{opacity:1;letter-spacing:.5em;filter:none}}
.os .sb{font:.8rem var(--fm);letter-spacing:.3em;color:rgb(147 190 255);opacity:0;animation:fi .8s ease 3.9s forwards}
.os .sk{position:absolute;bottom:-3.2rem;font:.68rem var(--fm);letter-spacing:.2em;color:rgb(147 160 190);opacity:.8}
@keyframes fi{to{opacity:1}}
/* ---------- Empire Map ---------- */
#empire{position:fixed;inset:0;z-index:90;display:grid;grid-template-rows:2.9rem minmax(0,1fr) auto;background:radial-gradient(ellipse 90% 70% at 50% 0%,#0f2347,#04080f 78%);color:#e2eaf6}
html[data-theme=light] #empire{background:radial-gradient(ellipse 90% 70% at 50% 0%,#dbe7fb,#c4d3ec 80%);color:#0e1c36}
#empire .eb{display:flex;align-items:center;gap:.6rem;padding:0 .6rem;border-bottom:1px solid rgb(var(--wb)/.4)}
#empire .eb h2{font:700 1rem var(--fd);letter-spacing:.2em;color:var(--tmax);white-space:nowrap}
#empire .eb .sp{flex:1}
.sample{display:inline-flex;align-items:center;padding:.2rem .5rem;border-radius:.2rem;border:1px solid rgb(var(--pv)/.8);background:rgb(var(--pv)/.14);color:rgb(var(--pv));font:700 .66rem var(--fm);letter-spacing:.12em;white-space:nowrap}
.mapw{position:relative;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.bnrow{position:relative;flex:none;height:4.7rem;border-bottom:1px solid rgb(var(--wb)/.18)}.lay{position:relative;flex:1;min-height:0}
.lay svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.frm{position:absolute;border:1px solid rgb(var(--wb)/.35);border-radius:.4rem;background:rgb(var(--wb)/.05);background-image:linear-gradient(rgb(var(--wb)/.1) 1px,transparent 1px),linear-gradient(90deg,rgb(var(--wb)/.1) 1px,transparent 1px);background-size:25% 25%}
.frm span{position:absolute;left:.5rem;top:.3rem;font:700 .62rem var(--fm);letter-spacing:.2em;color:rgb(var(--wbi))}
.bn{position:absolute;top:.3rem;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.15rem;min-width:0;padding:.1rem}
.bn .pl{width:2.2rem;height:2.2rem}.bn .pl svg{width:100%;height:100%;display:block}.bn .nm{font:700 .66rem/1.1 var(--fd);letter-spacing:.04em;text-align:center;white-space:nowrap}
.bn.dim,.cn.dim{opacity:.22}.bn.wn .pl{outline:2px dashed rgb(var(--pv));outline-offset:2px;border-radius:.4rem}.bn.sel .pl{filter:drop-shadow(0 0 .6rem rgb(var(--c)))}
.bn .wall{font:700 .54rem var(--fm);letter-spacing:.1em;color:rgb(var(--pv));white-space:nowrap}
.cn{position:absolute;width:.9rem;height:.9rem;margin:-.45rem 0 0 -.45rem;border-radius:50%;background:var(--cx,#8ea6cf);box-shadow:0 0 0 2px rgb(0 0 0/.4)}
.cn::after{content:'';position:absolute;inset:-.45rem}

let E=null;
function empData(){const biz=entries().slice(0,12),ids=new Set(biz.map(b=>b.id));
 /* Atra wall: a wall-flagged business never appears in any client's list, on the map or in the scan. */
 const cl=SAMPLE_CLIENTS.map(c=>Object.assign({},c,{biz:c.biz.filter(b=>ids.has(b)&&!(ROSTER[b]&&ROSTER[b].wall))})).filter(c=>c.biz.length);return{biz,cl}}
function pos(c){const f=FR[c.pl];return{x:f.x+(c.lon-f.lo[0])/(f.lo[1]-f.lo[0])*f.w,y:f.y+(1-(c.lat-f.la[0])/(f.la[1]-f.la[0]))*f.h}}
function leads(D){const out=[],ok=id=>D.biz.some(b=>b.id===id&&!b.wall),nm=id=>(D.biz.find(b=>b.id===id)||{}).name;
 D.cl.forEach(c=>{const has=id=>c.biz.includes(id);
  if(c.tags.includes('waterfront')&&has('kul')&&!has('lgy')&&ok('lgy'))out.push({k:c.id+'>lgy',c:c.id,to:'lgy',why:'Bought waterfront property through '+nm('kul')+' — a natural boating conversation for '+nm('lgy')+'.'});
  if(c.tags.includes('commercial')&&!has('cms')&&ok('cms'))out.push({k:c.id+'>cms',c:c.id,to:'cms',why:'Commercial-property client — a '+nm('cms')+' conversation (build-out, renovation).'});
  if(c.tags.includes('commercial')&&!has('bma')&&ok('bma'))out.push({k:c.id+'>bma',c:c.id,to:'bma',why:'Commercial-property client — a '+nm('bma')+' conversation (branding the premises).'});
  if(c.renew!=null&&c.renew<=9&&!has('e12')&&ok('e12'))out.push({k:c.id+'>e12',c:c.id,to:'e12',why:'Mortgage renewal in about '+c.renew+' months and not an '+nm('e12')+' client yet — time for a renewal conversation.'})});
 return out.filter(l=>!store.scan.dismissed.includes(l.k))}

 buildMap();buildIntro();$('#e-x').onclick=closeEmpire;$('#e-scan').onclick=()=>{E.L=leads(E.D);E.li=0;E.mode='scan';E.sel=null;paintMap();paintDock()};paintDock()}

function buildMap(){const D=E.D,n=D.biz.length;let nodes='',lay='';
 ['Ottawa','Costa Rica'].forEach(k=>{const f=FR[k];lay+='<div class="frm" style="left:'+f.x+'%;top:'+f.y+'%;width:'+f.w+'%;height:'+f.h+'%"><span>'+k.toUpperCase()+' · SAMPLE</span></div>'});
 lay+='<svg viewBox="0 0 100 100" preserveAspectRatio="none" id="lines" aria-hidden="true"></svg>';
 D.biz.forEach((b,i)=>{const x=(i+.5)/n*100;b._x=x;nodes+='<button class="bn'+(b.wall?' wn':'')+'" data-b="'+esc(b.id)+'" style="left:'+x+'%;--c:'+esc(b.c)+';width:'+(100/n)+'%" aria-label="'+esc(b.name+(b.wall?' — wall, business node only':''))+'"><span class="pl">'+plate(b)+'</span><span class="nm">'+esc(shortName(b))+'</span>'+(b.wall?'<span class="wall">WALL</span>':'')+'</button>'});
 D.cl.forEach(c=>{const p=pos(c);c._p=p;lay+='<button class="cn'+(c.biz.length>1?' shared':'')+'" data-c="'+c.id+'" style="left:'+p.x+'%;top:'+p.y+'%" aria-label="'+esc(c.n+' (SAMPLE)')+'"></button>'});
 const w=$('#mapw');w.innerHTML='<div class="bnrow">'+nodes+'</div><div class="lay">'+lay+'</div>';w.onclick=ev=>{const b=ev.target.closest('[data-b]'),c=ev.target.closest('[data-c]');if(b){E.sel={t:'b',id:b.dataset.b};E.mode='hint'}else if(c){E.sel={t:'c',id:c.dataset.c};E.mode='hint'}else{E.sel=null;E.mode='hint'}paintMap();paintDock()};paintMap()}
function shortName(b){return({kul:'KÜL','lgy':'Lions Gate',bma:'Brand My Aqua',cms:'CMS',pez:'purEnzyme',siq:'StructureIQ',e12:'8Twelve',atra:'Atra Lend',bp:'BluePrint',nb:'Northbirch'})[b.id]||b.name}
function paintMap(){const D=E.D,svg=$('#lines'),sel=E.sel,prop=E.mode==='scan'?E.L[E.li]:null;let p='';
 const act=new Set(),actC=new Set();
 if(sel&&sel.t==='b'){D.cl.forEach(c=>{if(c.biz.includes(sel.id)){actC.add(c.id);c.biz.forEach(b=>act.add(b))}});act.add(sel.id)}
 if(sel&&sel.t==='c'){const c=D.cl.find(x=>x.id===sel.id);if(c){actC.add(c.id);c.biz.forEach(b=>act.add(b))}}
 D.cl.forEach(c=>c.biz.forEach(b=>{const bx=(D.biz.find(x=>x.id===b)||{})._x;if(bx==null)return;const dim=sel&&!actC.has(c.id);const col=rgb((ROSTER[b]||D.biz.find(x=>x.id===b)).c);
  p+='<path class="lk'+(dim?' dim':'')+'" stroke="'+col+'" d="M'+bx+' 12C'+bx+' 22,'+c._p.x+' 18,'+c._p.x+' '+c._p.y+'"/>'}));
 if(prop){const c=D.cl.find(x=>x.id===prop.c),b=D.biz.find(x=>x.id===prop.to);if(c&&b)p+='<path class="lk prop" stroke="'+rgb(b.c)+'" d="M'+b._x+' 12C'+b._x+' 22,'+c._p.x+' 18,'+c._p.x+' '+c._p.y+'"/>'}
 svg.innerHTML=p;
 document.querySelectorAll('.bn').forEach(e=>{const id=e.dataset.b;e.classList.toggle('dim',!!sel&&!act.has(id));e.classList.toggle('sel',!!sel&&sel.t==='b'&&sel.id===id)});
 document.querySelectorAll('.cn').forEach(e=>{const id=e.dataset.c;e.classList.toggle('dim',!!sel&&!actC.has(id));e.classList.toggle('sel',!!sel&&sel.t==='c'&&sel.id===id)})}
function paintDock(){const D=E.D,d=$('#dock');let h='';
 if(E.mode==='scan'){const L=E.L,l=L[E.li];if(!l){h='<div class="tx"><span class="t1">No leads to suggest</span><span class="t2">Nothing in the SAMPLE client lists matches a rule right now. Nothing was sent or changed.</span></div><div class="ac"><button class="btn q" data-e="hint">BACK TO MAP</button></div>'}
  else{const c=D.cl.find(x=>x.id===l.c),b=D.biz.find(x=>x.id===l.to);h='<div class="tx"><span class="t1"><span class="sample">SAMPLE</span> '+esc(c.n)+' → '+esc(b.name)+' <span style="font-weight:400;opacity:.7">('+(E.li+1)+'/'+L.length+')</span></span><span class="t2"><b>Why:</b> '+esc(l.why)+' <b>Suggestion only</b> — nothing is sent, merged or acted on. You decide.</span></div><div class="ac"><button class="btn q" data-e="prev" aria-label="Previous suggestion">◂</button><button class="btn q" data-e="next" aria-label="Next suggestion">▸</button><button class="btn q" data-e="dismiss">NOT NOW</button><button class="btn" data-e="hint">DONE</button></div>'}}
 else if(E.sel&&E.sel.t==='b'){const b=D.biz.find(x=>x.id===E.sel.id),cs=D.cl.filter(c=>c.biz.includes(b.id));
  h=b.wall?'<div class="tx"><span class="t1">'+esc(b.name)+' · WALL</span><span class="t2">Atra Lend appears as a business node only. No client data flows into or out of Atra — not on the map, not in the lead-scan, no exceptions.</span></div>':'<div class="tx"><span class="t1">'+esc(b.name)+' · '+cs.length+' SAMPLE client'+(cs.length===1?'':'s')+'</span><span class="t2">'+cs.filter(c=>c.biz.length>1).length+' shared with another business (the glowing dots). Tap empty map to clear.</span></div>';h+='<div class="ac"><button class="btn q" data-e="hint">CLEAR</button></div>'}
 else if(E.sel&&E.sel.t==='c'){const c=D.cl.find(x=>x.id===E.sel.id);h='<div class="tx"><span class="t1"><span class="sample">SAMPLE</span> '+esc(c.n)+' · '+esc(c.pl)+'</span><span class="t2">Client of '+c.biz.map(id=>esc(shortName(D.biz.find(b=>b.id===id)))).join(' + ')+(c.biz.length>1?' — shared, so it is drawn connected to each.':'.')+'</span></div><div class="ac"><button class="btn q" data-e="hint">CLEAR</button></div>'}
 else h='<div class="tx"><span class="t1">'+D.biz.length+' businesses · '+D.cl.length+' <span class="sample">SAMPLE</span> clients</span><span class="t2">These clients are SAMPLE — a single file cannot read the apps\' real client lists. Live client connections arrive in the full Canopy shell. Tap a business or a client; glowing dots are shared. Atra Lend is a business node only.</span></div>';
 d.innerHTML=h}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-e]');if(!t||!E)return;const a=t.dataset.e;
 if(a==='hint'){E.mode='hint';E.sel=null}else if(a==='next')E.li=(E.li+1)%E.L.length;else if(a==='prev')E.li=(E.li-1+E.L.length)%E.L.length;

function buildIntro(){const el=$('#intro'),D=E.D,W=el.clientWidth||innerWidth,H=el.clientHeight||innerHeight;let dots='',lines='';const k=D.biz.length,cx=W/2,cy=H*.46,rx=Math.min(W*.36,H*.8),ry=H*.34,rr=Math.max(4,Math.min(W,H)*.011);
 D.biz.forEach((b,i)=>{const a=i/k*Math.PI*2-Math.PI/2,x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry,a2=(i+3)/k*Math.PI*2-Math.PI/2;dots+='<circle class="sd" cx="'+x+'" cy="'+y+'" r="'+rr+'" fill="'+rgb(b.c)+'" style="animation-delay:'+(1.2+i*.12)+'s"/>';lines+='<path class="st1" pathLength="1" d="M'+x+' '+y+'L'+(cx+Math.cos(a2)*rx)+' '+(cy+Math.sin(a2)*ry)+'"/>'});
 let paws='';const ps=Math.max(.9,Math.min(W,H)/520);for(let i=0;i<8;i++){const x=W*(.08+i*.12),y=H*(i%2?.93:.87);paws+='<g class="paw" style="animation-delay:'+(.2+i*.28)+'s" transform="translate('+x+' '+y+') scale('+ps*2+') rotate('+(i%2?-8:8)+')"><ellipse cx="0" cy="1.5" rx="2.6" ry="2.1" fill="#9ec3ff"/><circle cx="-3.2" cy="-1.8" r="1.1" fill="#9ec3ff"/><circle cx="-1.1" cy="-3.2" r="1.1" fill="#9ec3ff"/><circle cx="1.1" cy="-3.2" r="1.1" fill="#9ec3ff"/><circle cx="3.2" cy="-1.8" r="1.1" fill="#9ec3ff"/></g>'}

 const end=()=>{el.classList.add('out');setTimeout(()=>{if(el.parentNode)el.remove()},620)};E.timer=setTimeout(end,reduced?1800:7400);['pointerdown','keydown'].forEach(n=>el.addEventListener(n,()=>{clearTimeout(E.timer);end()}))}
