<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GLIMMER — Holiday Lighting Estimator</title>
<meta name="theme-color" content="#3b0a1e">
<style>
:root{--ink:#241216;--ink2:#5c3a40;--cream:#fff6e4;--cream2:#f6e7c9;--berry:#8c1236;--berry2:#c2204e;--pine:#0f5a3c;--pine2:#1b8a5a;--gold:#f2b632;--ice:#7fd6ff;--line:#e2cfa6;--bad:#b3261e;--ok:#12794a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#2a0716;overflow:hidden}
#sky{position:fixed;inset:0;z-index:0;background:
 radial-gradient(1200px 700px at 15% 10%,#a3153f 0%,transparent 60%),
 radial-gradient(1000px 800px at 90% 90%,#0e6b45 0%,transparent 60%),
 radial-gradient(800px 600px at 80% 5%,#4b1d8f 0%,transparent 60%),#2a0716;background-size:140% 140%;animation:aur 40s ease-in-out infinite alternate}
@keyframes aur{to{background-position:100% 60%}}
#snow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#snow i{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:#ffe9f0;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(30px,110vh,0)}}
#santa{pointer-events:none;position:fixed;top:64px;left:-340px;width:300px;z-index:30;opacity:.95;animation:fly 38s linear 6s infinite;cursor:pointer}
@keyframes fly{0%{transform:translate(0,0)}8%{transform:translate(0,-6px)}16%{transform:translate(0,4px)}24%{transform:translate(0,-6px)}32%{transform:translate(0,4px)}40%,100%{transform:translate(calc(100vw + 680px),-4px)}}
#santa .nose{animation:nose 2.4s ease-in-out infinite}@keyframes nose{50%{opacity:.55}}
body.calm #santa,body.calm #snow{display:none}
body.calm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#santa,#snow{display:none}*{animation:none!important;transition:none!important}}
#app{position:relative;z-index:5;height:100%;display:grid;grid-template-columns:92px 1fr;grid-template-rows:60px 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 14px;color:#fff;background:linear-gradient(#1a0510cc,#1a051066);backdrop-filter:blur(6px)}
header h1{font:700 22px Georgia,serif;letter-spacing:.14em;margin:0;color:var(--gold);text-shadow:0 0 14px #f2b63266}
header .jn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;opacity:.95}
.tag{background:var(--cream);color:var(--ink);border-radius:8px 8px 8px 8px;padding:4px 12px;font-weight:800;font-size:18px;position:relative;transform-origin:50% -10px;animation:sway 5s ease-in-out infinite;min-height:44px;display:flex;flex-direction:column;justify-content:center;line-height:1.05;border:2px solid var(--gold)}
.tag small{font-weight:600;font-size:10.5px;color:var(--ink2);letter-spacing:.05em}
@keyframes sway{50%{transform:rotate(1.6deg)}}
.hb{min-width:44px;min-height:44px;border:0;border-radius:10px;background:#ffffff22;color:#fff;font:600 13px inherit;cursor:pointer;padding:0 10px}
.hb[aria-pressed=true]{background:var(--gold);color:var(--ink)}
nav#rail{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;overflow-y:auto;overflow-x:hidden}
nav#rail:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(#ffffff55,#ffffff22);z-index:0}
.bulb{position:relative;z-index:1;width:84px;min-height:58px;border:0;background:none;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;font:600 11px inherit}
.bulb .g{width:30px;height:30px;border-radius:50% 50% 46% 46%;background:var(--c,#777);opacity:.45;box-shadow:0 0 0 2px #00000055 inset;position:relative}
.bulb .g:before{content:"";position:absolute;top:-6px;left:9px;width:12px;height:8px;background:#444;border-radius:2px}
.bulb.done .g{opacity:1;box-shadow:0 0 14px 2px var(--c),0 0 0 2px #00000033 inset}
.bulb.on .g{opacity:1;transform:scale(1.18);box-shadow:0 0 22px 6px var(--c),0 0 0 2px #fff inset}
.bulb.on{color:var(--gold)}
.bulb .n{background:#000a;border-radius:8px;padding:0 5px;min-width:18px}
main{overflow:auto;padding:14px 16px 30px;-webkit-overflow-scrolling:touch}
.stage{max-width:1100px;margin:0 auto}
.panel{background:var(--cream);border-radius:16px;padding:14px 16px;margin:0 0 14px;box-shadow:0 8px 28px #0006;border:2px solid #fff3}
.panel h2{margin:0 0 8px;font:700 21px Georgia,serif;color:var(--berry)}
.panel h3{margin:10px 0 4px;font:700 14px system-ui;color:var(--pine);text-transform:uppercase;letter-spacing:.07em}
.sub{color:var(--ink2);font-size:13.5px;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:2px;min-width:92px;flex:1}
.f.s{flex:0 0 96px}.f.w{flex:2 1 220px}
.f label,.lab{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid var(--ice);border-color:var(--berry2)}
textarea{min-height:70px}
button.b,a.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:0;font:700 15px inherit;cursor:pointer;background:var(--berry);color:#fff;text-decoration:none}
.b.g2{background:var(--pine)}.b.o{background:#fff;color:var(--berry);border:2px solid var(--berry)}.b.k{background:var(--ink);color:#fff}.b.sm{min-height:44px;padding:0 12px;font-size:13px}.b.x{background:#fff;color:var(--bad);border:2px solid var(--bad)}
.seg{display:inline-flex;border:2px solid var(--berry);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;padding:0 16px;border:0;background:#fff;color:var(--berry);font:700 15px inherit;cursor:pointer}
.seg button.on{background:var(--berry);color:#fff}
.card{border:2px solid var(--line);border-radius:14px;margin:10px 0;background:#fffdf6;overflow:hidden}
.card>.hd{display:flex;gap:10px;align-items:center;padding:8px 12px;background:linear-gradient(90deg,#fff1cf,#fffdf6);cursor:pointer;min-height:52px}
.card>.hd .t{flex:1;font-weight:700}
.card>.hd .sets{font-weight:800;color:var(--pine);white-space:nowrap}
.card .bd{padding:10px 12px 12px;border-top:2px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:22px;border:2px solid var(--line);background:#fff;font-weight:600;cursor:pointer;user-select:none}
.chip input{width:22px;height:22px;min-height:0;accent-grid:0}
.chip.on{background:#e8f6ee;border-color:var(--pine2)}
.cdot{width:16px;height:16px;border-radius:50%;border:1px solid #0004;display:inline-block}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);padding:4px 6px;border-bottom:2px solid var(--line)}
.table td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.table td.n,.table th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:800;color:#fff}
.p-on{background:var(--ok)}.p-low{background:#b36b00}.p-up{background:#4b3aa3}.p-ord{background:var(--bad)}.p-off{background:#777}
.photos{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.ph{width:200px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;position:relative}
.ph img{display:block;width:100%;height:110px;object-fit:cover;cursor:crosshair}
.ph .cap{display:flex;flex-wrap:wrap;gap:4px;padding:4px;font-size:12px;align-items:center}
.ph .pn{position:absolute;top:4px;left:4px;background:var(--berry);color:#fff;border-radius:12px;padding:0 7px;font-weight:800;font-size:12px}
.note{background:#fff3c7;border-left:5px solid var(--gold);padding:8px 12px;border-radius:8px;font-size:13.5px;margin:8px 0}
.warn{background:#fde4e1;border-left-color:var(--bad)}
.lab-dock{position:sticky;bottom:0;z-index:3;display:flex;gap:10px;flex-wrap:wrap;background:#241216f2;color:#fff;border-radius:14px;padding:8px 12px;margin-top:8px;align-items:center}
.lab-dock .blk{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lab-dock input{width:64px;min-height:44px;padding:4px 6px}
.sw{position:relative;width:64px;height:44px;border-radius:22px;border:0;cursor:pointer;background:#777;color:#fff;font:800 12px inherit}
.sw.on{background:var(--ok)}
.big{font:800 26px Georgia,serif;color:var(--berry)}
.tot td{font-weight:800}
dialog{border:0;border-radius:16px;padding:16px;max-width:92vw;width:420px;background:var(--cream);color:var(--ink);box-shadow:0 12px 50px #000a}
dialog::backdrop{background:#000a}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#241216;color:#fff;padding:12px 18px;border-radius:12px;z-index:60;display:none;max-width:90vw;font-weight:600}
.addr-panel{background:#fff;border:2px dashed var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px}
.pinmark{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--berry2);border:2px solid #fff;color:#fff;font:800 12px/18px system-ui;text-align:center}
@media (max-width:760px){
 #app{grid-template-columns:1fr;grid-template-rows:56px 1fr 76px}
 header h1{font-size:17px}.hb.lbl{display:none}
 nav#rail{grid-row:3;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:0 6px;gap:0;background:#1a0510dd;justify-content:flex-start}
 nav#rail:before{left:0;right:0;top:20px;bottom:auto;width:auto;height:3px;margin:0}
 .bulb{flex:0 0 78px;width:78px;min-height:70px}
 main{grid-row:2;padding:10px 8px 20px}
 .panel{padding:12px}
 #santa{width:200px;top:60px}.lab-dock{position:static}
}
@media (max-height:640px){header{grid-row:1}.bulb{min-height:50px}.bulb .g{width:24px;height:24px}.panel{margin-bottom:10px}}
@media print{#sky,#snow,#santa,nav,header .hb{display:none}body{overflow:visible;background:#fff}#app{display:block}main{overflow:visible}}
</style>
</head>

 case'addrent':job.rentals.push({what:'',dates:''});save();render();break;
 case'rmrent':job.rentals.splice(+a,1);save();render();break;
 case'inc':job.crews[a].include=!job.crews[a].include;save();render();break;
 case'usetime':var mins=job.trees.concat(job.roofs).reduce(function(s,x){return s+itemTimeMin(x)},0);job.crews.install.hours=Math.floor(mins/60);job.crews.install.mins=mins%60;save();render();break;
 case'pinphoto':pinStart(a,e);break;
 case'custpic':customerPic(a);break;
 case'rmphoto':var pa=a.split('|'),pit=findItem(pa[0]);confirmDlg('Delete this photo and its pins?',function(){var ph=pit.photos.splice(+pa[1],1)[0];delAfter(ph.id);save();render()});break;
 case'copyorder':copyText(orderText());break;
 case'copytake':copyText(takeText());break;
 case'export':exportJob();break;
 case'print':window.print();break;
 case'geocopy':copyText(job.siteAddress);break}});
function delAfter(id){delPhoto(id)}
function confirmDlg(msg,fn){var d=$('#dlg');d.innerHTML='<p style="font-weight:700">'+esc(msg)+'</p><div class="row"><button class="b o" id="dn">Cancel</button><button class="b x" id="dy">Yes</button></div>';d.showModal();$('#dn').onclick=function(){d.close()};$('#dy').onclick=function(){d.close();fn()}}
function completeCust(){var d=draft,comm=d.type==='commercial';var label=comm?(d.company||'').trim():(d.name||'').trim();if(!label){toast(comm?'Add the company name first.':'Add the customer name first.');return}
 if(!(d.phone||'').trim()&&!(d.email||'').trim()){toast('Add a phone number or an email so the customer can be reached.');return}
 var c={id:uid('c'),type:d.type,company:d.company.trim(),contact:d.contact.trim(),name:d.name.trim(),phone:d.phone.trim(),email:d.email.trim(),site:d.site.trim(),billing:d.same?d.site.trim():d.billing.trim(),billingSame:d.same,notes:d.notes,created:Date.now()};
 store.customers.push(c);job.customerId=c.id;job.customer=Object.assign({},c);job.name=custLabel(c);if(!job.siteAddress)job.siteAddress=c.site;draft=null;dirty=true;saveNow();toast('Customer added to the book.');sec='trees';render()}
function mapOpen(kind){var ad=((document.getElementById('site')||{}).value||job.siteAddress||'').trim();job.siteAddress=ad;save();
 if(!ad){var s=document.getElementById('site');if(s)s.focus();toast('Type the site address first, then tap again.');return}
 var q=encodeURIComponent(ad);
 if(kind==='gmaps')window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener');
 else if(kind==='earth')window.open('https://earth.google.com/web/search/'+q,'_blank','noopener');
 else{window.open('https://maps.ottawa.ca/geoOttawa/','_blank','noopener');var gp=$('#geopanel');if(gp)gp.innerHTML='<div class="addr-panel"><b>GeoOttawa has no address deep link.</b> Paste this into its search box:<br><b>'+esc(ad)+'</b> <button class="b o sm" data-act="geocopy">Copy address</button></div>';copyText(ad,true)}}
function copyText(t,quiet){try{navigator.clipboard.writeText(t).then(function(){if(!quiet)toast('Copied.')},function(){if(!quiet)toast('Copy was blocked — select the text instead.')})}catch(e){if(!quiet)toast('Copy was blocked.')}}
function orderText(){var by={};stock(job).forEach(function(s){if(s.order>0)(by[s.sup]=by[s.sup]||[]).push(s.order+' x '+(PM[s.sku]||{name:s.sku}).name)});return Object.keys(by).map(function(k){return k+'\n'+by[k].join('\n')}).join('\n\n')||'Nothing to order.'}
function takeText(){var t=takeoff(job);return job.name+' — '+job.siteAddress+'\n\n'+t.lines.map(function(l){return l.qty+' x '+(PM[l.sku]||{name:l.sku}).name}).join('\n')+'\n\n'+(t.labour.map(function(l){return l.name+': '+l.men+' men x '+l.hrs.toFixed(2)+' h'}).join('\n')||'No crew work order in.')}
function wrapName(t){var p=t.parts||{},ev=t.kind==='evergreen',a=ev?['trunk','cone']:['trunk','canopy','limbs'],on=a.filter(function(k){return p[k]});if(!on.length)return 'none';if(on.length===a.length&&!ev)return 'all';if(ev&&on.length===2)return 'both';if(!ev&&on.join()==='trunk,canopy')return 'both';return on.join('+')}
function exportJob(){var p=priceOf(job),S=stock(job),cu=job.customer||{};
 var trees=job.trees.map(function(t){return Object.assign({},t,{type:t.kind,height:t.heightFt,wrap:wrapName(t),sets:treeSets(t),setsTotal:treeSets(t)*(n0(t.qty)||1)})});
 var roofs=job.roofs.map(function(r){var c=roofCalc(r);return Object.assign({},r,{label:r.name,length:r.lengthFt,qtyCalc:c.qty,unitCalc:c.unit})});
 var photoRefs=job.trees.concat(job.roofs,job.garlands,job.wreaths).map(function(i){return {item:i.id,photos:(i.photos||[]).map(function(p){return {id:p.id,pins:p.pins}})}});
 /* union of the checklist keys (client, customer, trees, rooflines…) and the estimator keys, plus additive customer / labour / inventory keys; the GLIMMER envelope rides along under "glimmer" */
 var o={id:job.id,name:job.name,client:cu.name||cu.company||job.name,customer:cu,customerId:job.customerId,siteAddress:job.siteAddress,address:job.siteAddress,billingSame:job.billingSame,billingAddress:job.billingAddress,status:job.status,date:job.date,notes:job.notes,
  trees:trees,rooflines:roofs,garlands:job.garlands,wreaths:job.wreaths,hardware:job.hw,electrical:job.el,rentals:job.rentals,
  photoRefs:photoRefs,pins:p.t.pins.map(function(x){return {item:x.item,photo:x.photo,n:x.n,what:x.what,qty:x.qty,price:x.price}}),
  labour:{install:job.crews.install,removal:job.crews.removal,scope:p.scope},
  inventory:{takeoff:p.t.lines,compare:S,orderList:S.filter(function(s){return s.order>0})},
  totals:{materials:p.materials,elements:p.elements,pins:p.pins,labour:p.labour,total:p.total},
  storageKey:KEY,exportedAt:new Date().toISOString(),
  glimmer:{exportShape:'glimmer-job/1',app:'GLIMMER',job:Object.assign({},job)}};
 var b=new Blob([JSON.stringify(o,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(job.name||'job').replace(/[^\w]+/g,'-')+'.glimmer.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
/* ---- pins ---- */
function pinStart(a,e){var pa=a.split('|'),it=findItem(pa[0]),ph=it.photos[+pa[1]],im=e.target,r=im.getBoundingClientRect();var x=Math.round((e.clientX-r.left)/r.width*1000)/10,y=Math.round((e.clientY-r.top)/r.height*1000)/10;
 var d=$('#dlg');d.innerHTML='<h3 style="margin-top:0">Pin '+((ph.pins||[]).length+1)+'</h3><div class="f"><label>What</label><input id="pw" placeholder="e.g. net lights on hedge"></div><div class="row"><div class="f"><label>How much (qty)</label><input id="pqn" inputmode="decimal" value="1"></div><div class="f"><label>Price each ($, optional)</label><input id="ppr" inputmode="decimal"></div></div><div class="row" style="margin-top:10px"><button class="b o" id="pc">Cancel</button><button class="b g2" id="pk">Add pin</button></div>';d.showModal();$('#pw').focus();
 $('#pc').onclick=function(){d.close()};$('#pk').onclick=function(){var w=$('#pw').value.trim();if(!w){toast('Say what the pin is for.');return}ph.pins=ph.pins||[];ph.pins.push({id:uid('n'),x:x,y:y,what:w,qty:$('#pqn').value||1,price:$('#ppr').value});d.close();save();render()}}
function customerPic(a){var pa=a.split('|'),it=findItem(pa[0]),ph=it.photos[+pa[1]];getPhoto(ph.id).then(function(u){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=im.width;c.height=im.height;var x=c.getContext('2d');x.drawImage(im,0,0);var r=Math.max(14,im.width/55);(ph.pins||[]).forEach(function(p,k){var px=p.x/100*c.width,py=p.y/100*c.height;x.beginPath();x.arc(px,py,r,0,7);x.fillStyle='#c2204e';x.fill();x.lineWidth=r/6;x.strokeStyle='#fff';x.stroke();x.fillStyle='#fff';x.font='bold '+Math.round(r*1.2)+'px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(k+1,px,py+1)});
  var d=$('#dlg');d.innerHTML='<img src="'+c.toDataURL('image/jpeg',.85)+'" alt="Marked-up photo" style="width:100%;border-radius:10px"><ol>'+(ph.pins||[]).map(function(p){return '<li>'+esc(p.what)+' × '+esc(p.qty||1)+'</li>'}).join('')+'</ol><div class="row"><button class="b o" id="cc">Close</button><a class="b g2" id="cd" download="customer-picture.jpg">Download</a></div>';$('#cd').href=c.toDataURL('image/jpeg',.85);d.showModal();$('#cc').onclick=function(){d.close()}};im.src=u})}
/* ---- chrome ---- */
function snow(){var s=$('#snow'),h='';for(var i=0;i<26;i++){h+='<i style="left:'+(Math.random()*100)+'%;animation-duration:'+(16+Math.random()*20)+'s;animation-delay:-'+(Math.random()*30)+'s;width:'+(3+Math.random()*4)+'px;height:'+(3+Math.random()*4)+'px"></i>'}s.innerHTML=h}
function calmSet(on){document.body.classList.toggle('calm',on);$('#calm').setAttribute('aria-pressed',on);store.settings.calm=on;save()}
$('#calm').addEventListener('click',function(){calmSet(!document.body.classList.contains('calm'))});
window.addEventListener('beforeunload',saveNow);
window.__glimmer={treeSets:treeSets,wrapName:wrapName,store:function(){return store},job:function(){return job},takeoff:takeoff,priceOf:priceOf,stock:stock,KEY:KEY,normJob:normJob};
idbOpen().then(function(){load();snow();if(store.settings.calm||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))calmSet(true);if(store.jobs.length===0){}render()});
})();
